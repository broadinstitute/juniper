        "name" : "agree",
        "html" : {
          "en" : "<p class=\"ddp-content__agreement only-margin-top extra-margin-top\">By completing this information, you are agreeing to allow us to contact these physician(s) and hospital(s) / institution(s) to obtain your child’s records.</p>",
          "es" : "<p class=\"ddp-content__agreement only-margin-top extra-margin-top\">Al completar esta información, acepta que nos pongamos en contacto con los médicos y hospitales o instituciones para obtener la historia clínica de su hijo(a).</p>"
        }
      }, {
        "name" : "RELEASE_MINOR_AGREEMENT",
        "type" : "boolean",
        "title" : {
          "en" : "<span>I have already read and signed the informed consent document for this study, which describes the use of my child’s personal health information (Section O: Authorization to use your child’s health information for research purposes), and hereby grant permission to Diane Diehl, PhD, Count Me In, 415 Main Street, 105B, Cambridge, MA 02142, or a member of the study team to examine copies of my child’s medical records pertaining to my child’s cancer diagnosis and treatment, and, if I elected on the informed consent document, to obtain my child’s cancer samples and/or blood samples for research studies. I acknowledge that a copy of this completed form will be accessible via my project account.</span>",
          "es" : "<span>He leído y firmado el consentimiento informado para este estudio, en el que se describe cómo se utilizará la información médica personal de mi hijo(a) (sección O: Autorización para usar la información médica de su hijo(a) para fines de investigación), y por el presente autorizo al Diane Diehl, PhD, Count Me In, 415 Main Street, 105B, Cambridge, MA 02142 o a los miembros del equipo de investigación a examinar copias de la historia clínica de mi hijo(a) en relación con el diagnóstico y tratamiento del cáncer de mi hijo(a). Asimismo, si así lo decidí en el consentimiento informado, los autorizo a obtener muestras del cáncer o de sangre de mi hijo(a) para el estudio. Entiendo que una copia de este formulario completado estará disponible en mi cuenta del proyecto.</span>"
