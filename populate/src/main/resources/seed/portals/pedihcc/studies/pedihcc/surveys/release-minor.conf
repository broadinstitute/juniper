        "type" : "html",
        "name" : "intro1",
        "html" : {
          "en" : "<p>Thank you for your consent to have your child participate in this research study.</p>\n <p>To complete the process and proceed with this study, we will need to collect some additional information from you below about the following:</p>\n <ul>\n <li><p>The name(s) and information for the physician(s) who has/have cared for your child throughout your child’s experiences with cancer</p></li>\n <li><p>The names of the hospitals / institutions where your child has received treatment or has had procedures performed (e.g. biopsies and/or surgeries)</p></li>\n </ul>\n <p>We may use this information to obtain copies of your child’s medical records, and if you have elected on the informed consent, we may also obtain some of your child’s stored cancer samples.</p>",
          "es" : "<p>Le agradecemos por dar su consentimiento para que su hijo(a) participe en este estudio de investigación.</p>\n <p>Para completar el proceso y proseguir con el estudio, le solicitamos la siguiente información:</p>\n <ul>\n <li><p>El nombre y la información de contacto de los médicos que atiendan a su hijo(a) o lo hayan atendido durante el cáncer que padece</p></li>\n <li><p>El nombre de los hospitales o instituciones en los que su hijo(a) haya recibido tratamiento o en los que se haya realizado procedimientos (como biopsias y operaciones)</p></li>\n </ul>\n <p>Utilizaremos esta información para obtener copias de la historia clínica de su hijo(a) y, si así lo dispuso en el consentimiento informado, también solicitaremos algunas de sus muestras de cáncer almacenadas.</p>"
        }
      } ]
    }, {
