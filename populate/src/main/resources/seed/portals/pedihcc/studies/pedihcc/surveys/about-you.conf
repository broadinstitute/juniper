          "es" : "<details>\n <summary><strong>Referencias bibliográficas para preguntas sobre raza y etnicidad</strong></summary>\n <p>Las preguntas 3, 3a, 3b, and 3c en este cuestionario están basada en las preguntas y respuestas sobre raza y etnicidad desarrolladas por el programa de investigación <i>All of Us</i> de los Institutos Nacionales de Salud (National Institutes of Health) o por el 2014 National Survey of Latinos del Centro de Investigación Pew (Pew Research Center). Las referencias bibliográficas para estas preguntas se presentan a continuación:</p>\n <ul>\n <li><p>Cronin RM, Jerome RN, Mapes B, Andrade R, Johnston R, Ayala J, Schlundt D, Bonnet K, Kripalani S, Goggins K, Wallston KA, Couper MP, Elliott MR, Harris P, Begale M, Munoz F, Lopez-Class M, Cella D, Condon D, AuYoung M, Mazor KM, Mikita S, Manganiello M, Borselli N, Fowler S, Rutter JL, Denny JC, Karlson EW, Ahmedani BK, O'Donnell CJ; Vanderbilt University Medical Center Pilot Team, and the Participant Provided Information Committee. <u>Development of the Initial Surveys for the All of Us Research Program.</u> Epidemiology. 2019 Jul;30(4):597-608. doi: 10.1097/EDE.0000000000001028. PMID: 31045611; PMCID: PMC6548672.</p></li>\n <li><p>Mapes BM, Foster CS, Kusnoor SV, Epelbaum MI, AuYoung M, Jenkins G, Lopez-Class M, Richardson-Heron D, Elmi A, Surkan K, Cronin RM, Wilkins CH, Pérez-Stable EJ, Dishman E, Denny JC, Rutter JL; All of Us Research Program. <u>Diversity and inclusion for the All of Us research program: A scoping review.</u> PLoS One. 2020 Jul 1;15(7):e0234962. doi: 10.1371/journal.pone.0234962. PMID: 32609747; PMCID: PMC7329113.</p></li>\n <li><p>\"Multiracial in America.\" Pew Research Center, Washington, D.C. (June 11, 2015) <u>https://www.pewresearch.org/social-trends/2015/06/11/multiracial-in-america/</u></p></li>\n </u>\n </details>"
