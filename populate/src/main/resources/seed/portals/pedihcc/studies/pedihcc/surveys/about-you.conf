        "html" : {
          "en" : "<p>Please tell us more about $ddp.isGovernedParticipant(\"your child\",\"you\") by answering the questions below. As you fill out the questions, the answers will be automatically saved. If you would like to leave the survey and complete it at another time, it will be available in the Dashboard.</p>\n <p> You can reach us by emailing <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> if you have any questions.</p>\n <p>If you would like to withdraw from the project, you can contact the team at <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> at any time. Any information that has already been entered into the system cannot be withdrawn, however no additional data will be generated.</p>",
