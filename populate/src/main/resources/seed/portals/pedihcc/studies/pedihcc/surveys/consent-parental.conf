        "type" : "html",
        "name" : "agree_item1",
        "html" : {
          "en" : "<ul>\n <li><p>You can perform (or work with others to perform) genomic and/or molecular tests on the saliva sample(s) from my child that I will send you and store the sample(s) until this research study is complete.</p></li>\n <li><p>You can request my child’s medical records from my child’s physicians and the hospitals and other places where my child received and/or continue to receive their treatment and link results of any tests you perform on my child’s saliva and blood and cancer samples (if I have chosen to share them with you) with my child’s medical record information.</p></li>\n <li><p>You can store the answers that I/my child provide in study surveys until this research study is complete. You can contact me to notify me as additional survey(s) become available during the course of this research study that I/my child can choose to complete.</p></li>\n <li><p>You can study and share the results of the genomic, histologic, and/or molecular tests, survey responses, and my child’s medical information with established public databases (e.g., NIH/NCI data portals, cBioPortal for Cancer Genomics, Tumor Portal, The Exome Aggregation Consortium/Genome Aggregation Database ) and with other qualified researchers in a manner that does not include my child’s name, or any other information that could be used to readily identify my child, to be used by other qualified researchers to perform future research studies, including studies that have not yet been designed, studies for diseases other than cancer, and studies that may be for commercial purposes.</p></li>\n <li><p>You can use the results of studying my child’s biological samples and my child’s medical information for future research studies, including studies that have not yet been designed, studies for diseases other than cancer, and/or studies that may be for commercial purposes.</p></li>\n <li><p>You can contact me in the future for reasons related to this research study, for example to ask if I would be willing to sign any additional documents that my child’s hospital(s) may require in order to share my child’s medical records, or to ask for my child’s contact information when they are approaching the age of consenting for themselves.</p></li>\n <li><p>You can collect my child’s medical information until my child is able to consent for themselves (age of majority; between 18 and 21 years old depending on location). The data collection and generation may occur after my child reaches age of majority, but will only be done with information generated from when my child was a minor.</p></li>\n <li><p>If my child remains in the study when they reach the age that they must consent for themselves, you may contact them about reconsenting to the study. You may contact me to get my child’s contact information. If my child reconsents, the project team will continue to request medical records and cancer samples from any point in my child’s cancer treatment.</p></li>\n </ul>",
          "es" : "<ul>\n <li><p>Pueden realizar (o trabajar con otros para realizar) pruebas genómicas o moleculares en las muestras de saliva de mi hijo(a) que les enviaré y almacenar las muestras hasta la conclusión de este estudio de investigación.</p></li>\n <li><p>Pueden solicitar la historia clínica de mi hijo(a) a los médicos, hospitales y lugares en donde recibe (o recibió) tratamiento y vincular los resultados de las pruebas que realicen en las muestras de saliva, sangre y cáncer (si decido proporcionarlas) con la información de la historia clínica de mi hijo(a).</p></li>\n <li><p>Pueden conservar las respuestas que mi hijo(a) o yo proporcionemos en las encuestas del estudio hasta la conclusión de este estudio de investigación. Pueden comunicarse conmigo para invitarnos a responder otras encuestas que puedan surgir durante el curso de la investigación.</p></li>\n <li><p>Pueden analizar y compartir los resultados de las pruebas genómicas, histológicas o moleculares, las respuestas a las encuestas y la información médica de mi hijo(a) con bases de datos públicas reconocidas (p. ej., portales de datos de los NIH/NCI, cBioPortal for Cancer Genomics, TumorPortal, el Consorcio de Agregación de Exomas/Base de Datos de Agregación de Genomas) y con otros investigadores acreditados de un modo que no incluya el nombre de mi hijo(a) ni otro tipo de información que podría usarse para identificarlo, para que otros investigadores acreditados utilicen la información con el fin de realizar futuros estudios de investigación, lo que incluye estudios que aún no se hayan diseñado, estudios relativos a otras enfermedades distintas al cáncer y estudios que puedan tener fines comerciales.</p></li>\n <li><p>Pueden usar los resultados del análisis de las muestras biológicas de mi hijo(a) y su información médica para futuros estudios de investigación, lo que incluye estudios que aún no se hayan diseñado, estudios relativos a otras enfermedades distintas al cáncer o estudios que puedan tener fines comerciales.</p></li>\n <li><p>Pueden comunicarse conmigo en el futuro por motivos relacionados con el estudio, por ejemplo, para preguntarme si quiero firmar documentos adicionales que el hospital de mi hijo(a) requiera para compartir su historia clínica o solicitarme la información de contacto de mi hijo(a) cuando se aproxime a la edad en que debe prestar consentimiento por sí mismo.</p></li>\n <li><p>Pueden recopilar la información médica de mi hijo(a) hasta que tenga la capacidad de prestar su propio consentimiento (mayoría de edad; entre 18 y 21 años de edad según la ubicación). La recopilación y generación de datos pueden llevarse a cabo después de que mi hijo(a) alcance la mayoría de edad, pero solo se realizarán con la información generada cuando mi hijo(a) era menor de edad.</p></li>\n <li><p>Si mi hijo(a) continúa participando en el estudio cuando alcanza la edad en la que debe prestar su propio consentimiento, pueden comunicarse con él con relación a la renovación del consentimiento para el estudio. Pueden ponerse en contacto conmigo para obtener la información de contacto de mi hijo(a). Si mi hijo(a) renueva el consentimiento, el equipo del proyecto continuará solicitando las historias clínicas y muestras de cáncer de cualquier momento durante el tratamiento de cáncer de mi hijo(a).</p></li>\n </ul>"
