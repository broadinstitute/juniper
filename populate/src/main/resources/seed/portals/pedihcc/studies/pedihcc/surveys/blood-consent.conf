    "pages" : [ {
      "elements" : [ {
        "type" : "html",
        "name" : "blood_consent_intro",
        "html" : {
          "en" : "<p class=secondary-text>\n You are being asked to provide an additional blood sample as a current participant enrolled in Count Me In project, a patient-partnered research project of Count Me In.\n </p>",
          "es" : "<p class=secondary-text>\n [es]You are being asked to provide an additional blood sample as a current participant enrolled in Count Me In project, a patient-partnered research project of Count Me In.\n </p>"
        }
      }, {
        "type" : "panel",
        "elements" : [ {
          "type" : "html",
          "name" : "why_detail_title",
          "html" : {
            "en" : "Why am I being asked to provide an additional blood sample?",
            "es" : "[es]Why am I being asked to provide an additional blood sample?"
          }
        }, {
          "type" : "html",
          "name" : "why_detail",
          "html" : {
            "en" : "\n An additional blood sample collection may help us to better understand how tumors, and patients’ responses to treatments, may change over time.\n ",
            "es" : "\n [es]An additional blood sample collection may help us to better understand how tumors, and patients’ responses to treatments, may change over time.\n "
          }
        }, {
          "type" : "html",
          "name" : "involvement_detail_title",
          "html" : {
            "en" : "What is involved if I agree to provide an additional blood sample?",
            "es" : "[es]What is involved if I agree to provide an additional blood sample?"
          }
        }, {
          "type" : "html",
          "name" : "involvement_detail",
          "html" : {
            "en" : "\n We will ask you to have an additional sample of blood (2 teaspoons) drawn at your physician’s\n office, local clinic, or nearby lab facility – we will provide detailed instructions on how to do this.\n We’ll then ask you to send the sample to us in a pre-stamped package that we will provide.\n ",
            "es" : "\n [es]We will ask you to have an additional sample of blood (2 teaspoons) drawn at your physician’s\n office, local clinic, or nearby lab facility – we will provide detailed instructions on how to do this.\n We’ll then ask you to send the sample to us in a pre-stamped package that we will provide.\n "
          }
        }, {
          "type" : "html",
          "name" : "participate_detail_title",
          "html" : {
            "en" : "Do I have to participate in this additional blood draw?",
            "es" : "[es]Do I have to participate in this additional blood draw?"
          }
        }, {
          "type" : "html",
          "name" : "participate_detail",
          "html" : {
            "en" : "No. Providing an additional blood sample is voluntary.",
            "es" : "[es]No. Providing an additional blood sample is voluntary."
          }
        }, {
          "type" : "html",
          "name" : "benefit_detail_title",
          "html" : {
            "en" : "Will I benefit from providing additional blood samples?",
            "es" : "[es]Will I benefit from providing additional blood samples?"
          }
        }, {
          "type" : "html",
          "name" : "benefit_detail",
          "html" : {
            "en" : "\n While providing additional blood samples will not improve your own health, the information we\n collect from these samples may aid in our research efforts to provide better cancer treatment and\n prevention options to future patients. We will provide updates about key research discoveries made\n possible by your participation on our website and/or through email.\n ",
            "es" : "\n [es]While providing additional blood samples will not improve your own health, the information we\n collect from these samples may aid in our research efforts to provide better cancer treatment and\n prevention options to future patients. We will provide updates about key research discoveries made\n possible by your participation on our website and/or through email.\n "
          }
        }, {
          "type" : "html",
          "name" : "risk_detail_title",
          "html" : {
            "en" : "What are the risks of providing an additional blood sample?",
            "es" : "[es]What are the risks of providing an additional blood sample?"
          }
        }, {
          "type" : "html",
          "name" : "risk_detail",
          "html" : {
            "en" : "\n You may experience slight pain and swelling at the site of the blood draw. These reactions are rare\n and should get better within a few days. If they do not, you should contact your doctor. There may\n be a risk that your information (which includes your genetic information) could be seen by\n unauthorized individuals. However, we have procedures and security measures in place designed to\n minimize this risk and protect the confidentiality of your information.",
            "es" : "\n [es]You may experience slight pain and swelling at the site of the blood draw. These reactions are rare\n and should get better within a few days. If they do not, you should contact your doctor. There may\n be a risk that your information (which includes your genetic information) could be seen by\n unauthorized individuals. However, we have procedures and security measures in place designed to\n minimize this risk and protect the confidentiality of your information."
          }
        }, {
          "type" : "html",
          "name" : "cost_detail_title",
          "html" : {
            "en" : "Will it cost me anything to provide an additional blood sample?",
            "es" : "[es]Will it cost me anything to provide an additional blood sample?"
          }
        }, {
          "type" : "html",
          "name" : "cost_detail",
          "html" : {
            "en" : "No.",
            "es" : "[es]No."
          }
        }, {
          "type" : "html",
          "name" : "sharing_detail1_title",
          "html" : {
            "en" : "Who will use my blood samples?",
            "es" : "[es]Who will use my blood samples?"
          }
        }, {
          "type" : "html",
          "name" : "sharing_detail1",
          "html" : {
            "en" : "<p>\n Your samples will be available to researchers at the Broad Institute of MIT and Harvard, a not-forprofit\n biomedical research institute. After removing your name and other readily identifiable\n information, we may share research results obtained from your blood samples with the greater\n research community as well as central data banks at the National Institutes of Health.\n </p>\n <p>\n In some cases, a research doctor may contact you to find out if you would be interested in participating\n in a different or future research study based on information that may have been found in your blood samples.\n </p>\n <p>\n To allow sharing of information with other researchers, the National Institutes of Health (NIH) and other\n organizations have developed central data (information) banks that analyze information and collect the results of\n certain types of genetic studies. These central banks will store your genetic and medical information and provide\n the information to qualified researchers to do more studies. We will also store your genetic and medical\n information at the Broad Institute of MIT and Harvard and share your information with other qualified researchers.\n Therefore, we are asking your permission to share your results with these special banks and other researchers, and\n have your information used for future research studies, including studies that have not yet been designed, studies\n involving diseases other than cancer, and/or studies that may be for commercial purposes (such as the development\n or approval of new drugs). Your information will be sent to central banks and other researchers only with a code\n number attached. Your name, social security number, and other information that could readily identify you will not\n be shared with central banks or other researchers. We will never sell your readily identifiable information to\n anyone under any circumstances.\n </p>",
            "es" : "<p>\n [es]Your samples will be available to researchers at the Broad Institute of MIT and Harvard, a not-forprofit\n biomedical research institute. After removing your name and other readily identifiable\n information, we may share research results obtained from your blood samples with the greater\n research community as well as central data banks at the National Institutes of Health.\n </p>\n <p>\n [es]In some cases, a research doctor may contact you to find out if you would be interested in participating\n in a different or future research study based on information that may have been found in your blood samples.\n </p>\n <p>\n [es]To allow sharing of information with other researchers, the National Institutes of Health (NIH) and other\n organizations have developed central data (information) banks that analyze information and collect the results of\n certain types of genetic studies. These central banks will store your genetic and medical information and provide\n the information to qualified researchers to do more studies. We will also store your genetic and medical\n information at the Broad Institute of MIT and Harvard and share your information with other qualified researchers.\n Therefore, we are asking your permission to share your results with these special banks and other researchers, and\n have your information used for future research studies, including studies that have not yet been designed, studies\n involving diseases other than cancer, and/or studies that may be for commercial purposes (such as the development\n or approval of new drugs). Your information will be sent to central banks and other researchers only with a code\n number attached. Your name, social security number, and other information that could readily identify you will not\n be shared with central banks or other researchers. We will never sell your readily identifiable information to\n anyone under any circumstances.\n </p>"
          }
        }, {
          "type" : "html",
          "name" : "payment_detail_title",
          "html" : {
            "en" : "Will I be paid to take part in this research study?",
            "es" : "[es]Will I be paid to take part in this research study?"
          }
        }, {
          "type" : "html",
          "name" : "payment_detail",
          "html" : {
            "en" : "No, you will not be paid for providing an additional blood sample.",
            "es" : "[es]No, you will not be paid for providing an additional blood sample."
          }
        }, {
          "type" : "html",
          "name" : "options_detail_title",
          "html" : {
            "en" : "What other options are there?",
            "es" : "[es]What other options are there?"
          }
        }, {
          "type" : "html",
          "name" : "options_detail",
          "html" : {
            "en" : "\n Providing an additional blood sample is voluntary – you may choose not to participate. Your\n decision not to participate will not affect your medical care in any way or result in any penalty or\n loss of benefits. It will also not affect the participation you have already agreed to for this research\n study.\n ",
            "es" : "\n [es]Providing an additional blood sample is voluntary – you may choose not to participate. Your\n decision not to participate will not affect your medical care in any way or result in any penalty or\n loss of benefits. It will also not affect the participation you have already agreed to for this research\n study.\n "
          }
        }, {
          "type" : "html",
          "name" : "taking_part_detail1_title",
          "html" : {
            "en" : "Can I stop taking part in this research study?",
            "es" : "[es]Can I stop taking part in this research study?"
          }
        }, {
          "type" : "html",
          "name" : "taking_part_detail1",
          "html" : {
            "en" : "<p>\n Yes, you can stop being in the research study at any time. We will not be able to withdraw all the\n information that has already been used for research. If you tell us that you want to stop being in the\n study, we will destroy any remaining blood or DNA samples we have. We will not perform any\n additional tests on the samples. However, we will keep the results from the tests we did before you\n stopped being in the study. We will not be able to take back the information that already has been\n used or shared with other researchers, central data banks, or that has been used to carry out related\n activities such as oversight, or that is needed to ensure quality of the study.\n </p>\n <p>\n To withdraw your permission, please contact the research doctor or study staff listed below by\n emailing <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a>\n or calling <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a>:\n </p>\n <ul><li>Diane Diehl, PhD (Principal Investigator of the Study)</li></ul>\n <p>\n If you choose to not participate, or if you are not eligible to participate, or if you withdraw from this\n research study, this will not affect your present or future care and will not cause any penalty or loss\n of benefits to which you are otherwise entitled.\n </p>",
            "es" : "<p>\n [es]Yes, you can stop being in the research study at any time. We will not be able to withdraw all the\n information that has already been used for research. If you tell us that you want to stop being in the\n study, we will destroy any remaining blood or DNA samples we have. We will not perform any\n additional tests on the samples. However, we will keep the results from the tests we did before you\n stopped being in the study. We will not be able to take back the information that already has been\n used or shared with other researchers, central data banks, or that has been used to carry out related\n activities such as oversight, or that is needed to ensure quality of the study.\n </p>\n <p>\n [es]To withdraw your permission, please contact the research doctor or study staff listed below by\n emailing <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a>\n or calling <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a>:\n </p>\n <ul><li>[es]Diane Diehl, PhD (Principal Investigator of the Study)</li></ul>\n <p>\n [es]If you choose to not participate, or if you are not eligible to participate, or if you withdraw from this\n research study, this will not affect your present or future care and will not cause any penalty or loss\n of benefits to which you are otherwise entitled.\n </p>"
          }
        }, {
          "type" : "html",
          "name" : "confidentiality_detail1_title",
          "html" : {
            "en" : "What about confidentiality?",
            "es" : "[es]What about confidentiality?"
          }
        }, {
          "type" : "html",
          "name" : "confidentiality_detail1",
          "html" : {
            "en" : "<p>\n We will take rigorous measures to protect the confidentiality and security of all your information,\n but we are unable to guarantee complete confidentiality. When we receive your blood samples, your\n name and other information that could be used to readily identify you will be removed and replaced\n by a code. If we send your samples to our collaborators for gene testing, the samples will be\n identified using only this code. We will store your samples and information in locked facilities and\n in password-protected computer files at the Broad Institute and we will limit access to such files.\n We may share your identifiable information or coded information, as necessary, with regulatory or\n oversight authorities (such as the Office for Human Research Protections), ethics committees\n reviewing the conduct of the study, or as otherwise required by law.\n </p>\n <p>\n When we send the results of the gene tests and your medical information to central data banks or\n other researchers, they will not contain your name, social security number, or other information that\n could be used to readily identify you. The results of this research study or future research studies\n using the information from this study may be published in research papers or included in\n presentations that will become part of the scientific literature. You will not be identified in\n publications or presentations.\n </p>",
            "es" : "<p>\n [es]We will take rigorous measures to protect the confidentiality and security of all your information,\n but we are unable to guarantee complete confidentiality. When we receive your blood samples, your\n name and other information that could be used to readily identify you will be removed and replaced\n by a code. If we send your samples to our collaborators for gene testing, the samples will be\n identified using only this code. We will store your samples and information in locked facilities and\n in password-protected computer files at the Broad Institute and we will limit access to such files.\n We may share your identifiable information or coded information, as necessary, with regulatory or\n oversight authorities (such as the Office for Human Research Protections), ethics committees\n reviewing the conduct of the study, or as otherwise required by law.\n </p>\n <p>\n [es]When we send the results of the gene tests and your medical information to central data banks or\n other researchers, they will not contain your name, social security number, or other information that\n could be used to readily identify you. The results of this research study or future research studies\n using the information from this study may be published in research papers or included in\n presentations that will become part of the scientific literature. You will not be identified in\n publications or presentations.\n </p>"
          }
        }, {
          "type" : "html",
          "name" : "questions_detail1_title",
          "html" : {
            "en" : "What if I have questions?",
            "es" : "[es]What if I have questions?"
          }
        }, {
          "type" : "html",
          "name" : "questions_detail1",
          "html" : {
            "en" : "<p>\n If you have any questions, please send an email to <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> or\n call <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a> and ask to speak with one of the project managers about this study.\n </p>\n <p>\n For questions about your rights as a patient, please contact a representative of the Office for Human\n Research Studies at <a href=\"tel:617-632-3029\" class=\"Link\">617-632-3029</a>. This can include questions about your participation in the study,\n concerns about the study, a research related injury, or if you feel/felt under pressure to enroll in this\n research study or to continue to participate in this research study. Please keep a copy of this\n document in case you want to read it again.\n </p>",
            "es" : "<p>\n [es]If you have any questions, please send an email to <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> or\n call <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a> and ask to speak with one of the project managers about this study.\n </p>\n <p>\n [es]For questions about your rights as a patient, please contact a representative of the Office for Human\n Research Studies at <a href=\"tel:617-632-3029\" class=\"Link\">617-632-3029</a>. This can include questions about your participation in the study,\n concerns about the study, a research related injury, or if you feel/felt under pressure to enroll in this\n research study or to continue to participate in this research study. Please keep a copy of this\n document in case you want to read it again.\n </p>"
          }
        } ]
      }, {
        "type" : "html",
        "name" : "election_agree_title",
        "html" : {
          "en" : "<h3><u>Documentation of Consent</u></h3>",
          "es" : "<h3><u>Documentation of Consent</u></h3>"
        }
      }, {
        "type" : "html",
        "name" : "election_agree",
        "html" : {
          "en" : "This is what I agree to:\n <ul style=\"list-style-type: square\">\n <li>You can work with me to arrange a sample of blood to be drawn at my physician’s office, local clinic, or nearby lab facility.</li>\n <li>You can perform (or collaborate with others to perform) gene tests on the blood sample that I will send you and store the sample until this research study is complete.</li>\n <li>\n You can request my medical records from my physicians and the hospitals and other places where I\n received and/or continue to receive my treatment and link results of the gene tests you perform on my\n blood samples with my medical information from my medical records.\n </li>\n <li>\n You can use the results of the gene tests and my medical information for future research studies, including\n studies that have not yet been designed, studies for diseases other than cancer, and/or studies that may be for\n commercial purposes.\n </li>\n <li>\n You can share the results of the gene tests and my medical information with central data banks (e.g., the NIH)\n and with other qualified researchers in a manner that does not include my name, social security number, or any other\n information that could be used to readily identify me, to be used by other qualified researchers to perform future\n research studies, including studies that have not yet been designed, studies for diseases other than cancer, and\n studies that may be for commercial purposes.\n </li>\n </ul>",
          "es" : "This is what I agree to:\n <ul style=\"list-style-type: square\">\n <li>[es]You can work with me to arrange a sample of blood to be drawn at my physician’s office, local clinic, or nearby lab facility.</li>\n <li>[es]You can perform (or collaborate with others to perform) gene tests on the blood sample that I will send you and store the sample until this research study is complete.</li>\n <li>\n [es]You can request my medical records from my physicians and the hospitals and other places where I\n received and/or continue to receive my treatment and link results of the gene tests you perform on my\n blood samples with my medical information from my medical records.\n </li>\n <li>\n [es]You can use the results of the gene tests and my medical information for future research studies, including\n studies that have not yet been designed, studies for diseases other than cancer, and/or studies that may be for\n commercial purposes.\n </li>\n <li>\n [es]You can share the results of the gene tests and my medical information with central data banks (e.g., the NIH)\n and with other qualified researchers in a manner that does not include my name, social security number, or any other\n information that could be used to readily identify me, to be used by other qualified researchers to perform future\n research studies, including studies that have not yet been designed, studies for diseases other than cancer, and\n studies that may be for commercial purposes.\n </li>\n </ul>"
        }
      }, {
