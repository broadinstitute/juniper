        "type" : "html",
        "name" : "intro1",
        "html" : {
          "en" : "<p>Thank you for your interest in Count Me In. Here's what sign up and participation looks like:</p>\n <ul>\n <li>Registration - Answer a few short questions about yourself or your child (3 min)</li>\n <li>Consent Form - Read through and sign the consent form (10-15 min)</li>\n <li>Medical Release Form - Tell us where you or your child have been treated (5 min)</li>\n <li>Surveys - Answer questions about you or your child's experience with cancer (10-15 min)</li>\n </ul>\n <p>Your progress will be automatically saved so you can come back to any of these steps later.</p>",
          "es" : "<p>Gracias por su interés en Count Me In. Así lucen el registro y la participación:</p>\n <ul>\n <li>Inscripción - Responda unas pocas preguntas breves sobre usted o su hijo(a) (3 minutos)</li>\n <li>Formulario de consentimiento - Lea el formulario de consentimiento completo y fírmelo (10 a 15 minutos)</li>\n <li>Formulario de divulgación de información médica - Díganos dónde recibió tratamiento usted o su hijo(a) (5 minutos)</li>\n <li>Encuestas - Responda preguntas sobre su experiencia o la de su hijo(a) como paciente con cáncer (10 a 15 minutos)</li>\n </ul>\n <p>Su progreso se guardará de manera automática para que pueda regresar a cualquiera de estos pasos más tarde.</p>"
        }
      }, {
        "name" : "DESCRIBE",
        "type" : "checkbox",
        "title" : {
