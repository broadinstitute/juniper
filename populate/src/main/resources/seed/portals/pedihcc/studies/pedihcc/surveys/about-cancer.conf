    "pages" : [ {
      "elements" : [ {
        "type" : "html",
        "name" : "intro1",
        "html" : {
          "en" : "<p>Please tell us more about $ddp.isGovernedParticipant(\"your child's\",\"your\") cancer experience by answering the questions below. As you fill out the questions, the answers will be automatically saved. If you would like to leave the survey and complete it at another time, it will be available in the Dashboard. You can reach us by emailing <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> if you have any questions.</p>\n <p>If $ddp.isGovernedParticipant(\"your child has\",\"you have\") been diagnosed with mutiple cancer types, we will ask these questions for each diagnosis you've told us about.</p>\n <p>If you would like to withdraw from the project, you can contact the team at <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> at any time. Any information that has already been entered into the system cannot be withdrawn, however no additional data will be generated.</p>\n <p>After completing these questions, we will ask a few additional questions to understand more about $ddp.isGovernedParticipant(\"your child\",\"you\").</p>",
          "es" : "<p>Cuéntenos más sobre $ddp.isGovernedParticipant(\"la experiencia de su hijo(a)\",\"su experiencia\") como paciente con cáncer respondiendo las siguientes preguntas. Las respuestas se guardarán automáticamente a medida que responda. Si desea salir de la encuesta y responderla en otro momento, estará disponible automáticamente en su Tablero. Si tiene alguna pregunta, puede contactarnos escribiendo al correo electrónico <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a>.</p>\n <p>Si $ddp.isGovernedParticipant(\"a su hijo(a) le han diagnosticado\",\"le han diagnosticado\") múltiples tipos de cáncer, le haremos estas preguntas para cada diagnóstico que nos haya informado.</p>\n <p>Si desea retirarse del proyecto, puede contactar al equipo en <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> en cualquier momento. La información que ya haya sido ingresada en el sistema no podrá retirarse. Sin embargo, no se generarán datos adicionales.</p>\n <p>Después de responder estas preguntas, le haremos algunas preguntas adicionales para comprender mejor $ddp.isGovernedParticipant(\"la experiencia de su hijo(a)\",\"su experiencia\").</p>"
        }
      } ]
