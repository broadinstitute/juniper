    "title" : {
      "en" : "Survey: $ddp.isGovernedParticipant(\"Your Child's\",\"Your\") $ddp.answer(\"DIAGNOSIS_TYPE\",\"[DIAGNOSIS TYPE]\",true)",
      "es" : "Encuesta: $ddp.isGovernedParticipant(\"El\",\"Su\") $ddp.answer(\"DIAGNOSIS_TYPE\",\"[DIAGNOSIS TYPE]\",true) $ddp.isGovernedParticipant(\"de su hijo(a)\",\"\")"
