          "type" : "html",
          "name" : "intro_body1_title",
          "html" : {
            "en" : "Introduction",
            "es" : "Introducción"
          }
        }, {
          "type" : "html",
          "name" : "intro_body1",
          "html" : {
            "en" : "<p>This consent addendum gives new information about the research study in which you agreed to participate and will ask you to decide whether you would like to share stool sample(s) for the study. The procedures noted below are in addition to those which you were informed about in the previous consent form. If you decide to participate in this part of the study, please sign and date at the end of this form. You will receive a copy to the email address that you used to register for the project so that you can refer to it while you are involved in this research study. <br/> </p>\n <p>If you have any questions, please send an email to <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> or call <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a> and ask to speak with a member of the study staff about this study.</p>",
            "es" : "<p>Este anexo al consentimiento proporciona información nueva acerca del estudio de investigación en el que ha aceptado participar y le pedirá que decida si desea proporcionar muestras de heces para el estudio. Los procedimientos mencionados a continuación son complementarios de aquellos que se le informaron en el formulario de consentimiento anterior. Si decide participar en esta parte del estudio, firme y ponga la fecha al final de este formulario. Recibirá una copia en la dirección de correo electrónico que utilizó para registrarse en el proyecto, para que pueda consultarla mientras participa en el presente estudio de investigación. <br/> </p>\n <p>En caso de tener alguna pregunta, envíe un correo electrónico a <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> o llame al <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a> y solicite hablar con un miembro del equipo con relación a esta parte del estudio.</p>"
          }
        }, {
          "type" : "html",
          "name" : "description_body_title",
          "html" : {
            "en" : "Brief Description of the Project",
            "es" : "Descripción breve del proyecto"
          }
        }, {
          "type" : "html",
          "name" : "description_body",
          "html" : {
            "en" : "<p class=\"secondary-text\">“Count Me In” is a patient-driven movement that enables cancer patients to directly transform cancer research and discovery. Any individual who has ever been diagnosed with cancer has the opportunity to share information about their experience through completing surveys, sharing biological samples (saliva, blood and/or cancer samples, and in some cases, stool samples), and copies of their medical records with researchers in order to accelerate the pace of discovery. Because we are open to participants across the country regardless of where they are being treated, this study will allow many more cancer patients to contribute to research than has previously been possible.</p>",
            "es" : "<p class=\"secondary-text\">“Count Me In” es un movimiento impulsado por los pacientes que permite que los pacientes con cáncer transformen la investigación y el descubrimiento del cáncer de manera directa. Toda persona que alguna vez haya recibido un diagnóstico de cáncer tiene la oportunidad de compartir información sobre su experiencia al completar encuestas, compartir muestras biológicas (muestras de saliva, sangre o cáncer y, en algunos casos, muestras de heces) y copias de su historia clínica con los investigadores a fine de agilizar los descubrimientos. Gracias a que el estudio está disponible para participantes de todo el país, independientemente de dónde hayan recibido tratamiento, podrán realizar aportes a la investigación muchos más pacientes de los que antes era posible.</p>"
          }
        }, {
          "type" : "html",
          "name" : "procedures_body1_title",
          "html" : {
            "en" : "What are the new procedures involved?",
            "es" : "¿Cuáles son los nuevos procedimientos involucrados?"
          }
        }, {
          "type" : "html",
          "name" : "procedures_body1",
          "html" : {
            "en" : "<p>Because you have previously been diagnosed with colorectal cancer, we are asking if you would be willing to provide sample(s) of stool for the study. If you elect to participate, we will send you a sample collection kit in the mail which includes detailed instructions for how to provide your stool sample. We will then ask you to send the sample back to us in a pre-stamped package that we will provide. We may ask you to provide stool samples at multiple different time points. We will contact you before sending any of the stool collection kits. If you do not want to participate in the stool collection at any time, please just inform a study team member.</p>\n <p>In addition, we will ask you to complete an online survey through your project account. You will receive more information about this survey once a kit has been sent to you. After a stool sample is received, we may analyze the genes in the cells from your sample(s). The results of these analyses may be used to try to develop better ways to treat and prevent cancers.</p>",
            "es" : "<p>Dado que le han diagnosticado cáncer colorrectal con anterioridad, le preguntamos si estaría dispuesto a proporcionar muestras de heces para el estudio. Si decide participar, le enviaremos por correo postal un kit de obtención de muestras que incluye instrucciones detalladas sobre cómo proporcionar su muestra de heces. Luego, le pediremos que nos envíe la muestra en un paquete prepagado que le proporcionaremos. Es posible que le solicitemos que proporcione muestras de heces en distintos momentos. Antes de enviarle los kits de obtención de muestras de heces, nos comunicaremos con usted. Si no desea participar en la obtención de muestras de heces en algún momento, simplemente informe a un miembro del equipo del estudio.</p>\n <p>Asimismo, le pediremos que complete una encuesta en línea a través de su cuenta del proyecto. Recibirá más información sobre esta encuesta una vez que le enviemos un kit. Después de recibir una muestra de heces, podríamos analizar los genes de las células presentes en sus muestras. Es posible que los resultados de estos análisis se utilicen para intentar desarrollar mejores formas para tratar y prevenir el cáncer.</p>"
          }
        }, {
          "type" : "html",
          "name" : "risks_body_title",
          "html" : {
            "en" : "Are there any new risks associated with participating in this portion of the research study?",
            "es" : "¿Hay algún riesgo nuevo asociado con la participación en esta parte del estudio de investigación?"
          }
        }, {
          "type" : "html",
          "name" : "risks_body",
          "html" : {
            "en" : "There are no additional risks associated with this portion of the study.",
            "es" : "No hay riesgos adicionales asociados con esta parte del estudio."
          }
        }, {
          "type" : "html",
          "name" : "contact_body1_title",
          "html" : {
            "en" : "Whom do I contact if I have questions about the research study?",
            "es" : "¿A quién puedo contactar si tengo preguntas sobre el estudio de investigación?"
          }
        }, {
          "type" : "html",
          "name" : "contact_body1",
          "html" : {
            "en" : "<p>If you have questions about the study, please contact the research doctor or study staff listed below by emailing <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> or calling <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a>:</p>\n <ul class=\"ul-flat-list\">\n <li>Nikhil Wagle, MD</li>\n <li>Corrie Painter, PhD</li>\n <li>Elana Anastasio</li>\n </ul>\n <p>For questions about your rights as a patient, please contact a representative of the Office for Human Research Studies at (617)-632-3029. This can include questions about your participation in the study, concerns about the study, a research related injury, or if you feel/felt under pressure to enroll in this research study or to continue to participate in this research study. Please keep a copy of this document in case you want to read it again.</p>",
            "es" : "<p>En caso de tener alguna pregunta sobre el estudio comuníquese con el médico de la investigación o con un miembro del estudio indicado a continuación enviando un correo electrónico a <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> o llamando al teléfono <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a>:</p>\n <ul class=\"ul-flat-list\">\n <li>Nikhil Wagle, MD</li>\n <li>Corrie Painter, PhD</li>\n <li>Elana Anastasio</li>\n </ul>\n <p>Si tiene preguntas sobre sus derechos como paciente, póngase en contacto con un representante de la Oficina de Estudios de Investigación en Humanos al (617) 632-3029. Esto puede incluir preguntas acerca de su participación en el estudio, inquietudes sobre el estudio, una lesión relacionada con la investigación o si siente que está o ha estado bajo presión para inscribirse en este estudio de investigación o para continuar participando en este estudio de investigación. Conserve una copia de este documento en caso de querer volver a leerlo.</p>"
          }
        }, {
          "type" : "html",
          "name" : "agree_item1_title",
          "html" : {
            "en" : "<p class=\"consent-agree bold\">Documentation of Consent <br/><br/> This is what I agree to:</p>",
            "es" : "<p class=\"consent-agree bold\">Documentación del consentimiento <br/><br/>Acepto lo siguiente:</p>"
          }
        }, {
          "type" : "html",
          "name" : "agree_item1",
          "html" : {
            "en" : "<ul>\n <li><p>You can collect stool sample(s) from me by sending collection kit(s) to the mailing address provided on the previous form.</p></li>\n <li><p>You can perform (or work with others to perform) molecular tests on stool sample(s), and store the sample(s) until this research study is complete.</p></li>\n <li><p>You can store the responses that I provide in the associated surveys until this research study is complete.</p></li>\n <li><p>You can share the results of the molecular tests and survey responses with established public databases (e.g., NIH/NCI data portals, cBioPortal for Cancer Genomics, Tumor Portal, The Exome Aggregation Consortium/Genome Aggregation Database ) and wit other qualified researchers in a manner that does not include my name, or any other information that could be used to readily identify me, to be used by other qualified researchers to perform future research studies, including studies that have not yet been designed, studies for diseases other than cancer, and studies that may be for commercial purposes.</p></li>\n <li><p>You can use the results of studying my samples and my medical information for future research studies, including studies that have not yet been designed, studies for diseases other than cancer, and/or studies that may be for commercial purposes.</p></li>\n </ul>",
            "es" : "<ul>\n <li><p>Pueden obtener muestras de mis heces mediante el envío de kits de obtención de muestras a la dirección postal provista en el formulario anterior.</p></li>\n <li><p>Pueden realizar (o trabajar con otros para realizar) pruebas moleculares en las muestras de heces y almacenar las muestras hasta la conclusión de este estudio de investigación.</p></li>\n <li><p>Pueden conservar las respuestas que proporcione en las encuestas asociadas hasta la conclusión de este estudio de investigación.</p></li>\n <li><p>Pueden compartir los resultados de las pruebas moleculares y las respuestas a las encuestas con bases de datos públicas acreditadas (p. ej., portales de datos de los NIH/NCI, cBioPortal for Cancer Genomics, TumorPortal, el Consorcio de Agregación de Exomas/Base de Datos de Agregación de Genomas) y con otros investigadores calificados de un modo que no incluya mi nombre ni otro tipo de información que podría usarse para identificarme, para que otros investigadores acreditados utilicen la información con el fin de realizar futuros estudios de investigación, lo que incluye estudios que aún no se hayan diseñado, estudios relativos a otras enfermedades distintas al cáncer y estudios que puedan tener fines comerciales.</p></li>\n <li><p>Pueden usar los resultados del análisis de mis muestras y mi información médica para futuros estudios de investigación, lo que incluye estudios que aún no se hayan diseñado, estudios relativos a otras enfermedades distintas al cáncer o estudios que puedan tener fines comerciales.</p></li>\n </ul>"
          }
