            "en" : "<ul>\n <li>I have had enough time to read the consent addendum and think about continuing to participate in this study;</li>\n <li>I have had all of my questions answered to my satisfaction;</li>\n <li>I am willing to continue to participate in this study;</li>\n <li>I have been told that my continued participation is voluntary and I can withdraw at any timeI have been told that my continued participation is voluntary and I can withdraw at any time;</li>\n </ul>",
            "es" : "<ul>\n <li>He tenido tiempo suficiente para leer el anexo al consentimiento y considerar continuar participando en este estudio;</li>\n <li>Me han respondido todas mis preguntas de forma satisfactoria;</li>\n <li>Estoy dispuesto a seguir participando en este estudio;</li>\n <li>Se me ha informado que la decisión de continuar participando es voluntaria y que puedo retirarme en cualquier momento;</li>\n </ul>"
