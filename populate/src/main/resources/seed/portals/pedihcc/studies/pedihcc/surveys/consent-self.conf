            "en" : "We may ask you for information about contacting your physicians and the hospitals that you were treated at for your cancer. We will not disclose details about the results of your participation in this study with any of the individuals that we contact, but rather ask them to provide us with your medical history and (if you have agreed) your tissue samples.",
            "es" : "Le pediremos la información de contacto de sus médicos y de los hospitales en los que recibió tratamiento contra el cáncer. No divulgaremos los datos de los resultados del estudio con ellos, sino que les solicitaremos que nos envíen su historia clínica y (si está de acuerdo) sus muestras de tejidos."
