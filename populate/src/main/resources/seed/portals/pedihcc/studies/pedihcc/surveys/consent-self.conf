        "type" : "html",
        "name" : "agree_item1",
        "html" : {
          "en" : "<ul>\n <li><p>You can perform (or work with others to perform) genomic and/or molecular tests on the saliva sample(s) that I will send you and store the sample(s) until this research study is complete.</p></li>\n <li><p>You can request my medical records from my physicians and the hospitals and other where I received and/or continue to receive my treatment and link results of any tests you perform on my saliva and blood and cancer samples (if I have chosen to share them with you) with my medical record information.</p></li>\n <li><p>You can store the answers that I provide in study surveys until this research study is complete. You can contact me to notify me as additional survey(s) become available during the course of this research study that I can choose to complete.</p></li>\n <li><p>You can study and share the results of the genomic, histologic, and/or molecular tests, survey responses, and my medical information with established public databases (e.g., NIH/NCI data portals, cBioPortal for Cancer Genomics, Tumor Portal, The Exome Aggregation Consortium/Genome Aggregation Database ) and with other qualified researchers in a manner that does not include my name, or any other information that could be used to readily identify me, to be used by other qualified researchers to perform future research studies, including studies that have not yet been designed, studies for diseases other than cancer, and studies that may be for commercial purposes.</p></li>\n <li><p>You can use the results of studying my biological samples and my medical information for future research studies, including studies that have not yet been designed, studies for diseases other than cancer, and/or studies that may be for commercial purposes.</p></li>\n <li><p>You can contact me in the future for reasons related to this research study, for example to ask if I would be willing to sign any additional documents that my hospital(s) may require in order to share my medical records.</p></li>\n </ul>",
          "es" : "<ul>\n <li><p>Pueden realizar (o trabajar con otros para realizar) pruebas genómicas o moleculares en las muestras de saliva que les enviaré y almacenar las muestras hasta la conclusión de este estudio de investigación.</p></li>\n <li><p>Pueden solicitar mi historia clínica a los médicos, hospitales y lugares en donde recibo (o recibí) tratamiento y vincular los resultados de las pruebas que realicen en mis muestras de saliva, sangre y cáncer (si decido proporcionarlas) con la información de mi historia clínica.</p></li>\n <li><p>Pueden conservar las respuestas que proporcione en las encuestas del estudio hasta la conclusión de este estudio de investigación. Pueden comunicarse conmigo para invitarme a responder otras encuestas que puedan surgir durante el curso de la investigación.</p></li>\n <li><p>Pueden analizar y compartir los resultados de las pruebas genómicas, histológicas o moleculares, las respuestas a las encuestas y mi información médica con bases de datos públicas reconocidas (p. ej., portales de datos de los NIH/NCI, cBioPortal for Cancer Genomics, TumorPortal, el Consorcio de Agregación de Exomas/Base de Datos de Agregación de Genomas) y con otros investigadores acreditados de un modo que no incluya mi nombre ni otro tipo de información que podría usarse para identificarme, para que otros investigadores acreditados utilicen la información con el fin de realizar futuros estudios de investigación, lo que incluye estudios que aún no se hayan diseñado, estudios relativos a otras enfermedades distintas al cáncer y estudios que puedan tener fines comerciales.</p></li>\n <li><p>Pueden usar los resultados del análisis de mis muestras biológicas y mi información médica para futuros estudios de investigación, lo que incluye estudios que aún no se hayan diseñado, estudios relativos a otras enfermedades distintas al cáncer o estudios que puedan tener fines comerciales.</p></li>\n <li><p>Pueden comunicarse conmigo en el futuro por motivos relacionados con el estudio, por ejemplo para preguntar si acepto firmar otros documentos que mis hospitales pudieran requerir a fin de brindar acceso a mi historia clínica.</p></li>\n </ul>"
