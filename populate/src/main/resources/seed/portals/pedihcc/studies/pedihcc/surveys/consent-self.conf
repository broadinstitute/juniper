    "pages" : [ {
      "elements" : [ {
        "type" : "html",
        "name" : "intro",
        "html" : {
          "en" : "<p class=\"secondary-text\">Please read through the consent form text below and click “Next” when you are done to move on to the next section. If you have questions about the study or the consent form at any time, please contact us at <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a> or <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a>.</p>",
          "es" : "<p class=\"secondary-text\">Lea este formulario de consentimiento y haga clic en Siguiente cuando termine para pasar a la siguiente sección. Si tiene alguna pregunta sobre el estudio o el formulario de consentimiento, llámenos al teléfono <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a> o escriba a <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a>.</p>"
        }
      } ]
    }, {
      "elements" : [ {
        "type" : "html",
        "name" : "preamble",
        "html" : {
          "en" : "<p class=\"secondary-text\">“Count Me In” is a patient-driven movement that enables cancer patients to directly transform cancer research and discovery. Any individual who has ever been diagnosed with cancer has the opportunity to share information about their experience through completing surveys, sharing biological samples (saliva, blood and/or cancer samples, and in some cases, stool samples), and copies of their medical records with researchers in order to accelerate the pace of discovery. Because we are open to participants across the country regardless of where they are being treated, this study will allow many more cancer patients to contribute to research than has previously been possible.</p>",
          "es" : "<p class=\"secondary-text\">“Count Me In” es un movimiento impulsado por los pacientes que permite que los pacientes con cáncer transformen la investigación y el descubrimiento del cáncer de manera directa. Toda persona que alguna vez haya recibido un diagnóstico de cáncer tiene la oportunidad de compartir información sobre su experiencia al completar encuestas, compartir muestras biológicas (muestras de saliva, sangre o cáncer y, en algunos casos, muestras de heces) y copias de su historia clínica con los investigadores a fine de agilizar los descubrimientos. Gracias a que el estudio está disponible para participantes de todo el país, independientemente de dónde hayan recibido tratamiento, podrán realizar aportes a la investigación muchos más pacientes de los que antes era posible.</p>"
        }
      }, {
        "type" : "panel",
        "elements" : [ {
          "type" : "html",
          "name" : "purpose_body_title",
          "html" : {
            "en" : "What is the purpose of this study?",
            "es" : "¿Cuál es el propósito de este estudio?"
          }
        }, {
          "type" : "html",
          "name" : "purpose_body",
          "html" : {
            "en" : "We want to better understand cancers so that we can develop more effective therapies. By partnering directly with patients, we are able to study many more aspects of different cancers than would otherwise be possible.",
            "es" : "Queremos entender mejor los diferentes tipos de cáncer para poder desarrollar tratamientos más eficaces. Al colaborar directamente con los pacientes, podemos investigar muchos más aspectos de diferentes tipos de cáncer que los que, de otra forma, serían posibles."
          }
        }, {
          "type" : "html",
          "name" : "participation_body1_title",
          "html" : {
            "en" : "What will I have to do if I agree to participate in this study?",
            "es" : "¿Qué tendré que hacer si decido participar en este estudio?"
          }
        }, {
          "type" : "html",
          "name" : "participation_body1",
          "html" : {
            "en" : "<p>After signing a consent form, you will be asked to complete surveys about your experience with cancer. Additional survey(s) may become available during the course of this research study that you can choose to complete.</p>\n <p>We will ask that you send a saliva sample to us in a pre-stamped package that we will provide.</p>\n <p>We will ask you to complete a medical release form so that we are able to request your medical records. If we do so, we will take care of obtaining copies of your records from the hospitals or centers where you receive your medical care. If needed, we may contact you to ask if you would be willing to sign additional authorization forms or documents that certain hospitals or centers may require in order to share copies of your medical records with us.</p>\n <p>If you choose to share tissue specimens with us, we may also obtain small amounts of your stored cancer samples from hospitals or centers where you receive your care.</p>\n <p>If you choose to share blood with us, we may ask for a sample (or samples) of blood (1 tube, or 2 teaspoons per sample) to be drawn at your physician’s office, local clinic, or nearby lab facility – we will provide detailed instructions on how to do this.</p>",
            "es" : "<p>Después de que firme un formulario de consentimiento, le pediremos que responda unas encuestas sobre su experiencia como paciente con cáncer. También tendrá la oportunidad de responder otras encuestas que puedan surgir durante el curso de la investigación.</p>\n <p>Le pediremos que nos envíe una muestra de saliva en un paquete prepagado que le proporcionaremos.</p>\n <p>Le pediremos que complete un formulario de divulgación de información médica para que podamos solicitar su historia clínica. Si la solicitamos, nos encargaremos de obtener las copias de sus historias de los hospitales o centros en los que reciba atención médica. En caso de que sea necesario, nos comunicaremos con usted para solicitarle que complete otras autorizaciones o documentos que ciertos hospitales o centros podrían exigir para enviarnos las copias de sus historias clínicas.</p>\n <p>Si decide proporcionarnos muestras de tejido, también solicitaremos una pequeña parte de las muestras de cáncer que se encuentren en los hospitales o centros en los que recibe atención médica.</p>\n <p>Si decide proporcionarnos muestras de sangre, le pediremos que se realice una extracción (1 tubo o 2 cucharaditas por muestra) en el consultorio de su médico, en una clínica local o un laboratorio cercano. Le enviaremos instrucciones detalladas de cómo hacerlo.</p>"
          }
        }, {
          "type" : "html",
          "name" : "voluntary_body_title",
          "html" : {
            "en" : "Do I have to participate in this study?",
            "es" : "¿Tengo que participar en este estudio?"
          }
        }, {
          "type" : "html",
          "name" : "voluntary_body",
          "html" : {
            "en" : "No. Taking part in this study is voluntary. Even if you decide to participate now, you can always change your mind and leave the study at any time.",
            "es" : "No. Su participación en este estudio es voluntaria. Incluso si decide participar, siempre tendrá la posibilidad de cambiar de opinión y darse de baja del estudio."
          }
        }, {
          "type" : "html",
          "name" : "cost_body_title",
          "html" : {
            "en" : "Will it cost me anything to participate in this study?",
            "es" : "¿La participación en el estudio tendrá algún costo para mí?"
          }
        }, {
          "type" : "html",
          "name" : "cost_body",
          "html" : {
            "en" : "No.",
            "es" : "No."
          }
        }, {
          "type" : "html",
          "name" : "benefits_body_title",
          "html" : {
            "en" : "Will I benefit from participating?",
            "es" : "¿Me beneficiaré por participar?"
          }
        }, {
          "type" : "html",
          "name" : "benefits_body",
          "html" : {
            "en" : "While taking part in this study may not improve your own health, the information we collect will aid in research efforts to provide better cancer treatment and prevention options to future patients. We will provide updates about key research discoveries made possible by your participation.",
            "es" : "Si bien participar en este estudio no mejorará su salud, la información que recopilemos ayudará en las investigaciones para ofrecer un tratamiento más eficaz contra el cáncer y mejores opciones de prevención para futuros pacientes. Le comunicaremos toda la información sobre los principales descubrimientos que hayamos realizado gracias a su participación."
          }
        }, {
          "type" : "html",
          "name" : "risks_body1_title",
          "html" : {
            "en" : "What are the risks of taking part in this research?",
            "es" : "¿Cuáles son los riesgos de la participación en este estudio?"
          }
        }, {
          "type" : "html",
          "name" : "risks_body1",
          "html" : {
            "en" : "<p>If you choose to share blood, you may experience slight pain and swelling where the blood was drawn. These complications are rare and should resolve within a few days. If they do not, you should contact your doctor.</p>\n <p>There may be a risk that your information (which includes your genetic information and information from your medical records or surveys you’ve completed) could be seen by individuals who do not have permission to view it. However, we have procedures and security measures in place designed to reduce this risk and protect the confidentiality of your information. There is also a Federal law, known as the Genetic Information Nondiscrimination Act (GINA), which protects you from genetic discrimination. GINA generally makes it illegal for health insurance companies, group health plans, and most employers to discriminate against you based on your genetic information. However, this law does not protect you against genetic discrimination by companies that sell life insurance, disability insurance, or long-term care insurance. If you already have or have had cancer, any unauthorized disclosure of genetic results is unlikely to change an insurer’s view of your risk.</p>",
            "es" : "<p>Si decide proporcionar muestras de sangre, puede sentir un leve dolor e hinchazón en el lugar de la extracción. Estas complicaciones son poco frecuentes y se resuelven en unos pocos días. En caso contrario, se recomienda que consulte con su médico.</p>\n <p>Existe el riesgo de que personas que no están autorizadas accedan a sus datos (entre ellos, su información genética, historia clínica y encuestas que haya completado). Sin embargo, contamos con procedimientos y medidas de seguridad diseñados para reducir este riesgo y proteger su información confidencial. También existe una ley federal, llamada Ley contra la Discriminación por Información Genética (GINA), que protege a las personas frente a la discriminación por causas genéticas. GINA prohíbe que los seguros médicos, los planes de salud grupales y la mayoría de los empleadores discriminen a las personas por su información genética. Sin embargo, esta ley no protege a las personas frente a la discriminación por causas genéticas de parte de empresas que venden seguros de vida, seguros por discapacidad o seguros de atención a largo plazo. Si usted tiene o tuvo cáncer, es poco probable que una divulgación no autorizada de los resultados genéticos cambie la opinión de una aseguradora sobre su riesgo.</p>"
          }
        }, {
          "type" : "html",
          "name" : "sharing_body_title",
          "html" : {
            "en" : "Who will use my samples and see my information?",
            "es" : "¿Quién usará mis muestras y verá mi información?"
          }
        }, {
          "type" : "html",
          "name" : "sharing_body",
          "html" : {
            "en" : "Your samples and health information will be available to study staff and researchers at Count Me In and the Broad Institute of MIT and Harvard, which are both not-for-profit research organizations. After removing your name and other readily identifiable information, we will share results obtained from your participation with the greater research community via established public scientific databases (for example, the National Institute of Health/National Cancer Institute data portals such as the Genomic Data Commons and dbGaP, and the cBioPortal for Cancer Genomics). Some of these databases are publicly viewable by anyone with internet access, and some are restricted to qualified researchers.",
            "es" : "Sus muestras e información médica estarán a disposición del equipo y los investigadores del estudio de Count Me In y del Instituto Broad de MIT y Harvard, que son dos organizaciones de investigación sin fines de lucro. Luego de que eliminemos su nombre y cualquier otro tipo de información que pueda identificarlo, compartiremos los resultados obtenidos gracias a su participación con la comunidad de investigación a través de reconocidas bases de datos científicos de acceso público (por ejemplo, las bases de datos de los Institutos Nacionales de la Salud y el Instituto Nacional del Cáncer, como, el Genomic Data Commons, el dbGaP y el cBioPortal for Cancer Genomics). Algunas de estas bases de datos son de acceso público, y otras están restringidas a investigadores acreditados."
          }
        }, {
          "type" : "html",
          "name" : "withdraw_body_title",
          "html" : {
            "en" : "Can I stop taking part in this research study?",
            "es" : "¿Puedo dejar de participar en este estudio de investigación?"
          }
        }, {
          "type" : "html",
          "name" : "withdraw_body",
          "html" : {
            "en" : "Yes, you can withdraw from this research study at any time, although any information that has already been shared with researchers cannot be retrieved, and will not be deleted from our databases. Your information would be removed from future studies.",
            "es" : "Podrá abandonar el estudio clínico en cualquier momento, pero la información que se haya compartido con los investigadores no podrá recuperarse y no se eliminará de nuestras bases de datos. Su información se eliminará de futuros estudios."
          }
        }, {
          "type" : "html",
          "name" : "contact_body_title",
          "html" : {
            "en" : "What if I have questions?",
            "es" : "¿Qué hago si tengo preguntas?"
          }
        }, {
          "type" : "html",
          "name" : "contact_body",
          "html" : {
            "en" : "If you have any questions, please send an email to <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> or call <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a> and ask to speak with a member of the study staff about this study.",
            "es" : "Si tiene alguna pregunta, por favor envíe un correo electrónico a <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> o llame al <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a> y pida hablar con un integrante del equipo del estudio con relación a este estudio."
          }
        } ]
      } ]
    }, {
      "elements" : [ {
        "type" : "panel",
        "elements" : [ {
          "type" : "html",
          "name" : "intro_body1_title",
          "html" : {
            "en" : "Introduction",
            "es" : "Introducción"
          }
        }, {
          "type" : "html",
          "name" : "intro_body1",
          "html" : {
            "en" : "<p>You are being invited to participate in this research study because you have been diagnosed with cancer. This study will collect and analyze samples and health information of many patients with cancer, in order to help doctors and researchers better understand why cancers occur and develop ways to better treat and prevent them.</p>\n <p>Cancers occur when the molecules that control cell growth (such as genes or proteins) become changed or altered. Changes in genes are called “alterations” and can occur in cancer cells or normal tissues. Some alterations that occur in certain types of cancers have already been identified, which has led to the development of drugs that specifically target those alterations. However, the vast majority of cancer patients have not yet been studied, which means there is a tremendous amount of information still left to be discovered. A key goal of this research study is to discover more alterations, and to better understand those that have been previously described. We think this could lead to the future development of new or improved ways to treat and prevent cancer.</p>\n <p>We may perform different tests or analyses to determine if cells in the samples provided through this study contain any alterations. As an example, we would like to use your DNA to look for alterations in cells using a technology called “sequencing.” Sequencing can be used to read the “letters” of DNA in samples and look for these alterations. Genes are composed of DNA “letters,” which contain the instructions that tell the cells in our bodies how to grow and work. Using gene sequencing as a way to read DNA is one way to identify alterations that may contribute to the behavior of cancer. Some alterations or changes occur only in cancer cells. Other alterations may occur in normal cells as well, including in the genes that may have been passed from parent to child. This research study will examine both normal and cancer samples to look for alterations.</p>\n <p>Other than providing a saliva sample and, if you choose to, blood sample(s) (1 tube or 2 teaspoons per sample), participating in the study involves no new or additional tests or procedures. Cancer samples used for this study will come from stored samples obtained from previous clinical procedures. Study staff will not request samples unless they believe that the material remaining is sufficient for any future clinical needs.</p>\n <p>This form explains why this research study is being done, what is involved in participating, the possible risks and benefits of the study, alternatives to participation, and your rights as a participant. The decision to participate is yours. We encourage you to ask questions about the study now or in the future.</p>",
            "es" : "<p>Lo invitamos a participar en este estudio de investigación porque le han diagnosticado cáncer. Mediante el estudio, recopilaremos y analizaremos muestras e información médica de muchos pacientes con cáncer, con el objetivo de ayudar a médicos e investigadores a entender mejor por qué se produce el cáncer y desarrollar mejores tratamientos y opciones de prevención de la enfermedad.</p>\n <p>El cáncer aparece cuando las moléculas que controlan el crecimiento celular (como los genes o las proteínas) sufren un cambio o alteración. Los cambios en los genes se denominan “alteraciones” y pueden producirse tanto en células cancerosas como en tejidos sanos. La detección de algunas de las alteraciones que se generan en determinados tipos de cáncer permitió desarrollar medicamentos específicos contra ellas. Sin embargo, la gran mayoría de los pacientes con cáncer no han sido estudiados, por lo cual aún hay una gran cantidad de información por descubrir. Uno de los principales objetivos de este estudio de investigación es identificar más alteraciones y entender mejor las que ya se conocen. Creemos que eso contribuirá al futuro desarrollo de nuevos o mejores métodos de tratar y prevenir el cáncer.</p>\n <p>Es posible que realicemos distintas pruebas o análisis para determinar si existen alteraciones en las células de las muestras proporcionadas durante el estudio. Por ejemplo, analizaremos el ADN mediante una tecnología llamada \"secuenciación\" para saber si existen alteraciones en las células. La secuenciación se utiliza para leer las \"letras\" del ADN de las muestras y detectar dichas alteraciones. Los genes están compuestos por “letras” de ADN que contienen instrucciones para las células sobre su división y funcionamiento. Utilizar la secuenciación genética para leer el ADN es una manera de identificar las alteraciones que contribuyen al comportamiento del cáncer. Algunas alteraciones o cambios se producen únicamente en células cancerosas. Otras se podrían producir también en células sanas, y se incluyen en los genes que podrían haberse transmitido de padres a hijos. El estudio buscará alteraciones tanto en las células sanas como en las cancerosas.</p>\n <p>La participación en el estudio no requiere de otras pruebas o procedimientos más que una muestra de saliva y, si así lo decide, muestras de sangre (1 tubo o 2 cucharaditas por muestra). Las muestras de cáncer que se utilizarán en el estudio serán las que se hayan conservado a raíz de procedimientos clínicos anteriores. El equipo de investigación no solicitará muestras a menos que consideren que el material que queda será suficiente para futuras necesidades clínicas.</p>\n <p>En este documento se explica el objetivo del estudio de investigación, lo que implica la participación, los posibles riesgos y beneficios del estudio, otras alternativas si no desea participar y los derechos de los participantes. Participar o no es su decisión. Lo invitamos a hacer preguntas sobre el estudio en cualquier momento.</p>"
          }
        }, {
          "type" : "html",
          "name" : "purpose_body_title",
          "html" : {
            "en" : "Why is this research study being done?",
            "es" : "¿Cuál es el propósito de este estudio?"
          }
        }, {
          "type" : "html",
          "name" : "purpose_body",
          "html" : {
            "en" : "We want to understand cancer better so that we can develop more effective therapies. By partnering directly with patients, we will be able to study many more aspects of cancer than has previously been possible. In addition, because we are enrolling participants across the country regardless of where they are being treated, this study will allow many more patients to directly contribute to research than might otherwise be feasible.",
            "es" : "Queremos entender mejor los diferentes tipos de cáncer para poder desarrollar tratamientos más eficaces. Al colaborar directamente con los pacientes, podremos investigar muchos más aspectos de los diferentes tipos de cáncer que lo que ha sido posible anteriormente. Además, gracias a que el estudio está disponible para participantes de todo el país, independientemente de dónde reciban tratamiento, podrán realizar aportes directos a la investigación muchos más pacientes de los que, de otra manera, pudieran ser factibles."
          }
        }, {
          "type" : "html",
          "name" : "voluntary_body_title",
          "html" : {
            "en" : "What other options are there?",
            "es" : "¿Qué otras opciones hay?"
          }
        }, {
          "type" : "html",
          "name" : "voluntary_body",
          "html" : {
            "en" : "Taking part in this research study is voluntary – you may choose not to participate. Your decision not to participate will not affect your medical care in any way or result in any penalty or loss of benefits.",
            "es" : "La participación en este estudio es voluntaria, y puede decidir no participar. Si decide no participar, su atención médica no se verá afectada, y no deberá enfrentar ninguna sanción o pérdida de beneficios."
          }
        }, {
          "type" : "html",
          "name" : "involvement_body1_title",
          "html" : {
            "en" : "What is involved in the research study?",
            "es" : "¿Qué implica la participación en el estudio?"
          }
        }, {
          "type" : "html",
          "name" : "involvement_body1",
          "html" : {
            "en" : "<p>After signing a consent form, you will be asked to complete surveys about your experience with cancer. Additional survey(s) may become available during the course of this research study that you can choose to complete.</p>\n <p>We will also ask you to collect a sample of saliva at home--we will provide a kit and detailed instructions on how to do this.</p>\n <p>As part of this research study, we may obtain copies of your medical records. We may contact you to ask if you would be willing to sign any additional forms or documents that some hospitals or centers may require in order to share your medical records with us. You may also choose to send your medical records directly to us. We may link the information that comes from processing your samples with the information from your medical records.</p>\n <p>If you choose to share blood samples with us, we may ask you to have a sample of blood (1 tube or 2 teaspoons) drawn at your physician’s office, local clinic, or nearby lab facility. We’ll ask you to send any blood and/or saliva sample(s) to us in pre-stamped packages that we will provide. We may ask you to provide blood at multiple different time points. We will contact you before sending the blood kit. If you do not want to participate in the blood draw at that time, please just inform a study staff member.</p>\n <p>If you choose to share cancer samples with us, we may request a portion of your cancer sample through already stored biopsies or surgical specimens in hospitals or centers where you have received your medical care.</p>\n <p>We may study the cells from your samples (such as your saliva, cancer samples, and/or blood samples), including the genes found in the cells. No additional procedures will be required. The results will be used to try to develop better ways to treat and prevent cancers.</p>\n <p>To allow sharing of information with other researchers, the National Institutes of Health (NIH) and other organizations have developed central data (information) banks that analyze, collect, and share the information and results of certain types of genetic studies. Some (controlled-access) central data banks may store your genetic and medical information and provide the information to qualified researchers to use for further research. Other (open-access) data banks are publicly viewable by anyone with internet access. We will also store your genetic and medical information at the Broad Institute of MIT and Harvard and share your information with other qualified researchers. Therefore, we are asking your permission to share your results with these special data banks and other researchers, and have your information used for future research studies, including studies that have not yet been designed, studies involving diseases other than cancer, and/or studies that may be for commercial purposes (such as the development or approval of new drugs). Your information will be sent to central banks and other researchers only with a code number attached. Your name and other information that could readily identify you will not be shared with central banks or other researchers. We will never sell your readily identifiable information to anyone under any circumstances.</p>\n <p>In some cases, a researcher or study team member may contact you to find out if you would be interested in participating in a different or future research study based on information that may have been found in your samples or medical information.</p>",
            "es" : "<p>Después de que firme un formulario de consentimiento, le pediremos que responda unas encuestas sobre su experiencia como paciente con cáncer. También tendrá la oportunidad de responder otras encuestas que puedan surgir durante el curso de la investigación.</p>\n <p>También le solicitaremos que tome una muestra de saliva en su hogar. Para ello, le entregaremos un kit con instrucciones detalladas de cómo hacerlo.</p>\n <p>Como parte de este estudio de investigación, podríamos obtener copias de su historia clínica. Nos comunicaremos con usted si fuera necesario para solicitarle que complete otras autorizaciones o documentos que algunos hospitales o centros podrían exigir para enviarnos sus historias clínicas. También puede enviarnos directamente su historia clínica. Podríamos vincular la información que obtengamos a partir de las muestras con la información de su historia clínica.</p>\n <p>Si decide proporcionarnos muestras de sangre, le pediremos que se realice una extracción (1 tubo o 2 cucharaditas) en el consultorio de su médico, en una clínica local o un laboratorio cercano. Le pediremos que nos envíe las muestras de sangre o de saliva en un paquete prepagado que le proporcionaremos. Es posible que le solicitemos que proporcione muestras de sangre en distintos momentos. Nos pondremos en contacto antes de enviarle el kit de obtención de muestras de sangre. Si no desea participar en la obtención de muestras de sangre en ese momento, simplemente informe a un miembro del equipo del estudio.</p>\n <p>Si elige proporcionar muestras del cáncer, solicitaremos una parte de la muestra que se haya obtenido mediante biopsias o de muestras quirúrgicas tomadas en los hospitales o centros en los que recibe atención médica.</p>\n <p>Estudiaremos las células que se encuentren en las muestras (ya sea de saliva, sangre o cáncer), incluidos los genes de las células. No se requerirán procedimientos adicionales. Los resultados se utilizarán para intentar desarrollar mejores formas para tratar y prevenir el cáncer.</p>\n <p>Con el fin de intercambiar información con otros investigadores, los Institutos Nacionales de la Salud (NIH) y otras organizaciones crearon bancos centrales de datos para analizar, recopilar y compartir la información y los resultados de ciertos tipos de estudios genéticos. Algunos bancos centrales de datos de acceso restringido almacenarán su información genética y médica, y compartirán la información con investigadores acreditados para futuros estudios. Los bancos de datos de acceso abierto son de acceso público a través de Internet. Además, almacenaremos su información genética y médica en el Instituto Broad del MIT y Harvard, y la compartiremos con otros investigadores acreditados. Por lo tanto, le solicitamos su autorización para compartir los resultados con los bancos de datos mencionados y otros investigadores, y para utilizar su información en futuros estudios clínicos, entre ellos estudios que aún no se hayan diseñado, estudios sobre enfermedades distintas del cáncer o estudios que tengan fines comerciales (como el desarrollo o el registro de nuevos medicamentos). Su información se enviará a los bancos centrales de datos y a otros investigadores con un código numérico. No compartiremos con los bancos centrales ni con los otros investigadores su nombre ni otra información que pueda identificarlo. No venderemos su información personal a ninguna persona bajo ninguna circunstancia.</p>\n <p>En algunos casos, los miembros del equipo o los investigadores se pondrán en contacto para preguntarle si está interesado en participar en otro estudio de investigación en el futuro según la información que se obtenga de sus muestras o historia clínica.</p>"
          }
        }, {
          "type" : "html",
          "name" : "timing_body1_title",
          "html" : {
            "en" : "How long will I be in this research study?",
            "es" : "¿Cuánto tiempo estaré en este estudio?"
          }
        }, {
          "type" : "html",
          "name" : "timing_body1",
          "html" : {
            "en" : "<p>We will keep your saliva, blood, and cancer samples and medical records indefinitely until this study is finished, unless you inform us that you no longer wish to participate. You may do this at any time. More information about how to stop being in the study can be found below in section K: “Can I stop being in the research study and what are my rights?”</p>\n <p>Once the study is finished, any left over saliva and blood samples and copies of your medical records will be destroyed. Any cancer samples that we have will be returned to the pathology department at the hospital or other place where you received treatment.</p>",
            "es" : "<p>Conservaremos sus muestras de saliva, sangre y cáncer y su historia clínica hasta que finalice el estudio, excepto que nos informe que no quiere participar más en la investigación. Puede hacerlo en cualquier momento. Encontrará más información sobre cómo abandonar el estudio en la sección K: “¿Puedo abandonar el estudio? ¿Cuáles son mis derechos?“</p>\n <p>Una vez que el estudio se termine, se eliminará cualquier muestra de sangre o saliva que haya quedado y también su registros médicos. Las muestras de tejido que tengamos volverán a enviarse al departamento de patología del hospital u otro establecimiento donde recibió tratamiento.</p>"
          }
        }, {
          "type" : "html",
          "name" : "publishing_body_title",
          "html" : {
            "en" : "What kind of information could be found in this study and will I be able to see it?",
            "es" : "¿Qué tipo de información se pudiera obtener durante el estudio? ¿Podré verla?"
          }
        }, {
          "type" : "html",
          "name" : "publishing_body",
          "html" : {
            "en" : "While you will not receive information about your personal results obtained from studying your saliva, blood, or cancer samples, we will provide general results and major discoveries to all participants. We will do this by regularly updating participants through email newsletters, posts on social media, the Count Me In app, and/or the website that you used to enroll in this study. We will also publish important discoveries found through these studies in the scientific literature so that the entire research community can work together to better understand cancer. Your individual data will not be published in a way in which you could be readily identified. Abstracts, which are summaries of the published reports, will be available to you and the general public.",
            "es" : "Si bien no recibirá información sobre los resultados que obtengamos de sus muestras de saliva, sangre o cáncer, compartiremos con todos los participantes los resultados generales y los descubrimientos más importantes. Enviaremos las novedades a los participantes a través de correos electrónicos, publicaciones en redes sociales, por la aplicación de Count Me In o por la página web en que se inscribió en el estudio. Además, publicaremos los descubrimientos importantes de estos estudios mediante publicaciones en revistas especializadas, para que toda la comunidad científica pueda trabajar en conjunto para entender mejor el cáncer. No publicaremos su información personal, de modo que no se lo pueda identificar. Los resúmenes de los estudios que se publiquen estarán disponibles para usted y para el público en general."
          }
        }, {
          "type" : "html",
          "name" : "benefits_body_title",
          "html" : {
            "en" : "What are the benefits of the research study?",
            "es" : "¿Cuáles son los beneficios del estudio de investigación?"
          }
        }, {
          "type" : "html",
          "name" : "benefits_body",
          "html" : {
            "en" : "Taking part in this research study may not directly benefit you. By joining this study, you will help us and other researchers understand how to use gene tests to improve the care of patients with cancer in the future. We will provide study participants updates about key research discoveries made possible by your participation.",
            "es" : "Participar en este estudio no le beneficiará de manera directa. Su participación nos ayudará, a nosotros y a otros investigadores, a conocer de qué manera utilizar las pruebas genéticas para mejorar la atención médica de futuros pacientes con cáncer. Compartiremos con los participantes del estudio la información sobre los principales descubrimientos que hayamos realizado gracias a su participación."
          }
        }, {
          "type" : "html",
          "name" : "risks_body1_title",
          "html" : {
            "en" : "What are the risks or discomforts of the research study?",
            "es" : "¿Cuáles son los riesgos o molestias del estudio?"
          }
        }, {
          "type" : "html",
          "name" : "risks_body1",
          "html" : {
            "en" : "<p>If you choose to share blood, you may experience slight pain and swelling where the blood is drawn. These complications are rare and should get better within a few days. If they do not, you should contact your doctor.</p>\n <p>There is a risk that your information (which may include information from your survey responses, medical records, and/or sample testing and analysis) could be seen by people who do not have permission. However, we have procedures and security measures in place designed to minimize this risk and protect the confidentiality of your information. We have tried to minimize this risk by only providing trained study staff members access to where your information is stored. There is a Federal law, known as the Genetic Information Nondiscrimination Act (GINA), which protects you from genetic discrimination. GINA generally makes it illegal for health insurance companies, group health plans, and most employers to discriminate against you based on your genetic information. However, this law does not protect you against genetic discrimination by companies that sell life insurance, disability insurance, or long-term care insurance. If you already have or have had cancer, any unauthorized disclosure of genetic results is unlikely to change an insurer’s view of your risk.</p>\n <p>There is a small but real risk that if your samples are used for this research study, they might not be available for clinical care in the future. However, we have attempted to minimize this risk in the following way: the pathologists where your specimens are kept will not release your specimen unless they believe that there is enough material remaining for your future medical care.</p>",
            "es" : "<p>Si decide proporcionar muestras de sangre, puede sentir un leve dolor e hinchazón en el lugar de la extracción. Estas complicaciones son poco frecuentes y mejoran en unos pocos días. En caso contrario, se recomienda que consulte con su médico.</p>\n <p>Existe el riesgo de que personas que no están autorizadas accedan a sus datos (entre ellos, sus respuestas a las encuestas, su historia clínica o las pruebas y análisis hechos a sus muestras). Sin embargo, contamos con procedimientos y medidas de seguridad diseñados para reducir al mínimo este riesgo y proteger su información confidencial. Con el fin de disminuir el riesgo, solo miembros capacitados del personal del estudio tienen acceso al sitio en el que se almacena la información. Existe una ley federal, llamada Ley contra la Discriminación por Información Genética (GINA) que protege a las personas frente a la discriminación por causas genéticas. GINA prohíbe que los seguros médicos, los planes de salud grupales y la mayoría de los empleadores discriminen a las personas por su información genética. Sin embargo, esta ley no protege a las personas frente a la discriminación por causas genéticas de parte de empresas que venden seguros de vida, seguros por discapacidad o seguros de atención a largo plazo. Si usted tiene o tuvo cáncer, es poco probable que una divulgación no autorizada de los resultados genéticos cambie la opinión de una aseguradora sobre su riesgo.</p>\n <p>Si bien es poco probable, es posible que las muestras que utilicemos en el estudio no estén disponibles para una futura atención médica. Sin embargo, con el objetivo de reducir al mínimo este riesgo, los patólogos de los lugares en los que se conservan sus muestras no las entregarán a menos que quede una cantidad suficiente para una posible necesidad médica futura.</p>"
          }
        }, {
          "type" : "html",
          "name" : "paid_body_title",
          "html" : {
            "en" : "Will I be paid to take part in this research study?",
            "es" : "¿Recibiré algún pago por participar en este estudio?"
          }
        }, {
          "type" : "html",
          "name" : "paid_body",
          "html" : {
            "en" : "You will not be paid to take part in this study.",
            "es" : "No le pagarán por participar en este estudio"
          }
        }, {
          "type" : "html",
          "name" : "cost_body_title",
          "html" : {
            "en" : "What are the costs to take part in this research study?",
            "es" : "¿Cuáles son los costos por participar en este estudio?"
          }
        }, {
          "type" : "html",
          "name" : "cost_body",
          "html" : {
            "en" : "There are no costs to you to take part in this study.",
            "es" : "Participar en este estudio no le generará ningún gasto."
          }
        }, {
          "type" : "html",
          "name" : "withdraw_body1_title",
          "html" : {
            "en" : "Can I stop being in the research study and what are my rights?",
            "es" : "¿Puedo abandonar el estudio? ¿Cuáles son mis derechos?"
          }
        }, {
          "type" : "html",
          "name" : "withdraw_body1",
          "html" : {
            "en" : "<p>You can stop being in the research study at any time. We will not be able to withdraw all the information that already has been used for research. If you tell us that you want to stop being in the study, we will return any remaining cancer samples from where we obtained them, and destroy any remaining samples we have. We will not perform any additional tests on the samples. Additionally, we will not collect any additional medical records and we will destroy the copies of the medical records we already have. However, we will keep the results from the tests we did before you stopped being in the study. We will also keep the information we learned from reviewing your medical records before you stopped being in the study. We will not be able to take back the information that already has been used or shared with other researchers, central data banks, or that has been used to carry out related activities such as oversight, or that is needed to ensure quality of the study.</p>\n <p>To withdraw your permission, you must do so in writing by contacting the researcher below in section N: “Whom do I contact if I have questions about the research study?” If you choose to not participate, or if you are not eligible to participate, or if you withdraw from this research study, this will not affect your present or future care and will not cause any penalty or loss of benefits to which you are otherwise entitled.</p>",
            "es" : "<p>Puede abandonar el estudio en cualquier momento. No podremos retirar la información que ya se haya usado en la investigación. Si nos informa que no desea participar más del estudio, devolveremos las muestras de cáncer restantes al lugar de donde las obtuvimos y destruiremos el resto de las muestras que tengamos en nuestro poder. No realizaremos ninguna otra prueba con las muestras. Tampoco solicitaremos otras historias clínicas y destruiremos las copias que tengamos en nuestro poder. Sin embargo, conservaremos los resultados de las pruebas que hayamos realizado antes de que decidiera abandonar el estudio. También conservaremos la información que obtuvimos a partir de su historia clínica antes de que abandonara el estudio. No podremos recuperar la información que hayamos compartido con otros investigadores o bancos centrales de datos, o que se haya utilizado para realizar otras actividades relacionadas, como la supervisión del estudio, o que se necesite para garantizar la calidad del estudio.</p>\n <p>Si decide revocar su autorización, deberá comunicarse por escrito con el investigador que se indica en la sección N: “¿A quién debo contactar si tengo preguntas sobre el estudio?“ Si decide no participar, si no reúne los requisitos para participar o si abandona el estudio, su atención médica presente y futura no se verá afectada, y no deberá enfrentar ninguna sanción ni pérdida de beneficios.</p>"
          }
        }, {
          "type" : "html",
          "name" : "injury_body_title",
          "html" : {
            "en" : "What happens if I am injured or sick because I took part in this research study?",
            "es" : "¿Qué ocurre si me lesiono o me enfermo por haber participado en este estudio?"
          }
        }, {
          "type" : "html",
          "name" : "injury_body",
          "html" : {
            "en" : "There is little risk that you will become injured or sick by taking part in this study. There are no plans for this project to pay you or give you other compensation for any injury. You do not give up your legal rights by signing this form. If you think you have been injured as a result of taking part in this research study, please tell the person in charge of this research study as soon as possible. The research doctor’s contact information is listed in this consent form.",
            "es" : "Hay pocas posibilidades de que se lesione o enferme a raíz de su participación en el estudio. No planeamos pagarle ni darle ningún tipo de indemnización en el caso de que sufra alguna lesión. Al firmar este formulario, no renuncia a ninguno de los derechos que le otorga la ley. Si cree que ha sufrido una lesión por participar en este estudio de investigación, informe cuanto antes a la persona encargada del estudio. La información de contacto del investigador a cargo se indica en este formulario de consentimiento."
          }
        }, {
          "type" : "html",
          "name" : "confidentiality_body1_title",
          "html" : {
            "en" : "How will this study protect patient confidentiality?",
            "es" : "¿Cómo se protegerá en este estudio la confidencialidad del paciente?"
          }
        }, {
          "type" : "html",
          "name" : "confidentiality_body1",
          "html" : {
            "en" : "<p>We will take rigorous measures to protect the confidentiality and security of all your information, but we are unable to guarantee complete confidentiality. Information shared with the research team through email, or information accessible from a link in an email, is only protected by the security measures in place for your email account. Information from your medical records and genomic, histologic, and/or molecular tests will be protected in a HIPAA compliant database. HIPAA is a federal law that established national standards to protect sensitive health information from being disclosed without a patient's consent or knowledge.</p>\n <p>Your name and other information that could be used to readily identify you will be removed from your samples, and replaced by a randomized code. If we send your samples to other researchers for testing, the samples will be identified using only this code.</p>\n <p>We will store all of your identifiable information related to the study (including your medical records) in locked file cabinets and in password-protected computer files or secure databases at the Broad Institute and we will limit access to such files. We may share your identifiable information or coded information, as necessary, with regulatory or oversight authorities (such as the federal Office for Human Research Protections), ethics committees reviewing the conduct of the study, or as otherwise required by law. When we send information to central data banks or other researchers, it will not contain your name or other information that could be used to readily identify you.</p>\n <p>The results of this research study may be published in research papers or included in presentations that will become part of the scientific literature. You will not be identified in publications or presentations.</p>",
            "es" : "<p>Tomaremos rigurosas medidas para garantizar la confidencialidad y seguridad de su información, pero no podemos garantizarla por completo. La información que compartimos con el equipo de investigación mediante correo electrónico o la información a la que se accede a través de un enlace en un correo solo está protegida por las medidas de seguridad establecidas para su cuenta de correo electrónico. La información de su historia clínica y de las pruebas genómicas, histológicas y moleculares se protegerá en una base de datos que cumple con la Ley de Portabilidad y Responsabilidad del Seguro Médico (HIPAA). HIPAA es una ley federal que establece normas nacionales para asegurar que la información médica privada no se divulgue sin el consentimiento o conocimiento del paciente.</p>\n <p>Eliminaremos su nombre y otra información identificable de las muestras, y los reemplazaremos con un código aleatorio. Si enviamos sus muestras a otros investigadores para que las analicen, se identificarán solo a través de ese código.</p>\n <p>Almacenaremos su información identificable en relación con el estudio (incluso su historia clínica) en archivos cerrados con llave y en archivos electrónicos con contraseña, o en bases de datos seguras del Instituto Broad, y restringiremos su acceso. Según sea necesario, compartiremos su información identificable o la información codificada con las autoridades sanitarias o de supervisión (como la Oficina de Protección de los Seres Humanos en la Investigación, OHRP), los comités de ética que controlan la realización del estudio, o según lo estipule la ley. Cuando enviemos información a los bancos centrales de datos o a otros investigadores, esta no incluirá su nombre ni otra información identificable.</p>\n <p>Publicaremos los resultados del estudio de investigación en artículos de investigación o los incluiremos en presentaciones que luego formarán parte de publicaciones científicas. No se lo identificará en ninguna publicación o presentación.</p>"
          }
        }, {
          "type" : "html",
          "name" : "contact_body1_title",
          "html" : {
            "en" : "Whom do I contact if I have questions about the research study?",
            "es" : "¿A quién puedo contactar si tengo preguntas sobre el estudio de investigación?"
          }
        }, {
          "type" : "html",
          "name" : "contact_body1",
          "html" : {
            "en" : "<p>If you have questions about the study, please contact the research doctor or study staff listed below by emailing <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> or calling <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a>:</p>\n <ul class=\"ul-flat-list\">\n <li>Nikhil Wagle, MD</li>\n <li>Corrie Painter, PhD</li>\n <li>Elana Anastasio</li>\n </ul>\n <p>For questions about your rights as a patient, please contact a representative of the Office for Human Research Studies at (617)-632-3029. This can include questions about your participation in the study, concerns about the study, a research related injury, or if you feel/felt under pressure to enroll in this research study or to continue to participate in this research study. Please keep a copy of this document in case you want to read it again.</p>",
            "es" : "<p>En caso de tener alguna pregunta sobre el estudio comuníquese con el médico de la investigación o con un miembro del estudio indicado a continuación enviando un correo electrónico a <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> o llamando al teléfono <a href=\"tel:651-403-5315\" class=\"Link\">651-403-5315</a>:</p>\n <ul class=\"ul-flat-list\">\n <li>Nikhil Wagle, MD</li>\n <li>Corrie Painter, PhD</li>\n <li>Elana Anastasio</li>\n </ul>\n <p>Si tiene preguntas sobre sus derechos como paciente, póngase en contacto con un representante de la Oficina de Estudios de Investigación en Humanos al (617) 632-3029. Esto puede incluir preguntas acerca de su participación en el estudio, inquietudes sobre el estudio, una lesión relacionada con la investigación o si siente que está o ha estado bajo presión para inscribirse en este estudio de investigación o para continuar participando en este estudio de investigación. Conserve una copia de este documento en caso de querer volver a leerlo.</p>"
          }
        }, {
          "type" : "html",
          "name" : "authorization_body1_title",
          "html" : {
            "en" : "Authorization to use your health information for research purposes",
            "es" : "Autorización para usar su información médica para fines de investigación"
          }
        }, {
          "type" : "html",
          "name" : "authorization_body1",
          "html" : {
            "en" : "<p>Because information about you and your health is personal and private, it generally cannot be used in this research study without your written authorization. Federal law requires that your health care providers and healthcare institutions (hospitals, clinics, doctor’s offices) protect the privacy of information that identifies you and relates to your past, present, and future physical and mental health conditions.</p>\n <p>If you sign this form, it will provide your health care providers and healthcare institutions the authorization to disclose your protected health information to the Broad Institute for use in this research study. The form is intended to inform you about how your health information will be used or disclosed in the study. Your information will only be used in accordance with this authorization form and the informed consent form and as required or allowed by law. Please read it carefully before signing it.</p>\n <ol class=\"ol-flat-list\">\n <li>\n <span>What personal information about me will be used or shared with others during this research?</span>\n <ul class=\"inner-ul-flat-list\">\n <li><p class=\"normal no-margin\">Health information created from study-related surveys</p></li>\n <li><p class=\"normal no-margin\">Your medical records</p></li>\n <li><p class=\"normal only-margin-bottom\">Your saliva sample</p></li>\n </ul>\n <span class=\"normal secondary-text\">If elected (at the end of this form):</span>\n <ul class=\"inner-ul-flat-list\">\n <li><p class=\"normal no-margin\">Your blood sample(s)</p></li>\n <li><p class=\"normal only-margin-bottom\">Your cancer samples relevant to this research study and related records</p></li>\n </ul>\n </li>\n <li>\n <span>Why will protected information about me be used or shared with others?</span>\n <p class=\"normal\">The main reasons include the following:</p>\n <ul class=\"inner-ul-flat-list\">\n <li><p class=\"normal\">To conduct and oversee the research described earlier in this form;</p></li>\n <li><p class=\"normal\">To ensure the research meets legal, institutional, and accreditation requirements;</p></li>\n <li><p class=\"normal\">To conduct public health activities (including reporting of adverse events or situations where you or others may be at risk of harm);</p></li>\n <li><p class=\"normal\">To better understand the diseases being studied and to improve the design of future studies</p></li>\n </ul>\n </li>\n <li>\n <span>Who will use or share protected health information about me?</span>\n <p class=\"normal\">The Broad Institute and its researchers and affiliated research staff will use and/or share your personal health information in connection with this research study.</p>\n </li>\n <li>\n <span>With whom outside of the Broad Institute may my personal health information be shared?</span>\n <p class=\"normal\">While all reasonable efforts will be made to protect the confidentiality of your protected health information, it may also be shared with the following entities:</p>\n <ul class=\"inner-ul-flat-list\">\n <li><p class=\"normal\">Federal and state agencies (for example, the Department of Health and Human Services, the Food and Drug Administration, the National Institutes of Health, and/or the Office for Human Research Protections), or other domestic or foreign government bodies if required by law and/or necessary for oversight purposes.</p></li>\n <li><p class=\"normal\">Outside individuals or entities that have a need to access this information to perform functions relating to the conduct of this research such as data storage companies.</p></li>\n </ul>\n </li>\n <li>\n <span>For how long will protected health information about me be used or shared with others?</span>\n <p class=\"normal\">There is no scheduled date at which your protected health information that is being used or shared for this research will be destroyed, because research is an ongoing process.</p>\n </li>\n <li>\n <span>Statement of privacy rights:</span>\n <ul class=\"inner-ul-flat-list\">\n <li><p class=\"normal\">You have the right to withdraw your permission for the doctors and researchers to use or share your protected health information. We will not be able to withdraw all the information that already has been used or shared with others to carry out related activities such as oversight, or that is needed to ensure quality of the study. To withdraw your permission, you must do so in writing by contacting the researcher listed above in the section: “Whom do I contact if I have questions about the research study?”</p></li>\n <li><p class=\"normal\">You have the right to request access to your personal health information that is used or shared during this research and that is related to your treatment or payment for your treatment. To request this information, please contact your doctor who will request this information from the study directors.</p></li>\n </ul>\n </li>\n </ol>",
            "es" : "<p>Su información personal y médica es privada, por eso requerimos su autorización por escrito para poder utilizarla en el estudio. La legislación federal exige que los médicos e instituciones sanitarias (hospitales, clínicas, consultorios médicos) aseguren la privacidad de su información identificable y que se relacione con sus enfermedades físicas y mentales pasadas, presentes y futuras.</p>\n <p>Firmar este formulario implica que los médicos e instituciones sanitarias están autorizados a divulgar su información médica protegida al Instituto Broad para utilizarla en el estudio. El formulario detalla de qué manera se utilizará y divulgará su información médica en el estudio. La información se utilizará solo de acuerdo con la autorización y el presente consentimiento informado, y de conformidad con la ley. Antes de firmar, lea atentamente el documento.</p>\n <ol class=\"ol-flat-list\">\n <li>\n <span>¿Qué información personal sobre mí se utilizará o compartirá con terceros durante la investigación?</span>\n <ul class=\"inner-ul-flat-list\">\n <li><p class=\"normal no-margin\">Información médica obtenida de las encuestas del estudio</p></li>\n <li><p class=\"normal no-margin\">Historias clínicas</p></li>\n <li><p class=\"normal only-margin-bottom\">Muestra de saliva</p></li>\n </ul>\n <span class=\"normal secondary-text\">Si así se establece al final del consentimiento:</span>\n <ul class=\"inner-ul-flat-list\">\n <li><p class=\"normal no-margin\">Muestras de sangre</p></li>\n <li><p class=\"normal only-margin-bottom\">Muestras de cáncer pertinentes a este estudio de investigación y registros relacionados</p></li>\n </ul>\n </li>\n <li>\n <span>¿Por qué mi información protegida se utilizará y compartirá con otras personas?</span>\n <p class=\"normal\">Entre las principales razones, se incluyen las siguientes:</p>\n <ul class=\"inner-ul-flat-list\">\n <li><p class=\"normal\">Realizar y supervisar la investigación descrita anteriormente en este consentimiento;</p></li>\n <li><p class=\"normal\">Garantizar que la investigación cumpla con los requisitos legales, institucionales y de acreditación;</p></li>\n <li><p class=\"normal\">Realizar actividades de salud pública (entre ellas, la notificación de eventos adversos o situaciones en las que alguien pueda estar en riesgo);</p></li>\n <li><p class=\"normal\">Entender mejor las enfermedades que se están estudiando y mejorar el diseño de futuros estudios</p></li>\n </ul>\n </li>\n <li>\n <span>¿Quién usará y compartirá mi información médica protegida?</span>\n <p class=\"normal\">El Instituto Broad (Broad Institute), sus investigadores y el personal de investigación afiliado usarán y/o compartirán su información médica en conexión con este estudio de investigación.</p>\n </li>\n <li>\n <span>¿Con qué personas o entidades ajenas al Instituto Broad (Broad Institute) podría compartirse mi información de salud personal?</span>\n <p class=\"normal\">Si bien se tomarán todas las medidas razonables para proteger la confidencialidad de la la información médica protegida, esta también podría compartirse con las siguientes entidades:</p>\n <ul class=\"inner-ul-flat-list\">\n <li><p class=\"normal\">Organismos federales y estatales (por ejemplo, el Departamento de Salud y Servicios Humanos, la Administración de Alimentos y Medicamentos, los Institutos Nacionales de la Salud y la Oficina de Protección de los Seres Humanos en la Investigación) o con otros organismos gubernamentales locales y extranjeros si así lo requiere la ley o por motivos de supervisión.</p></li>\n <li><p class=\"normal\">Personas o entidades externas que tengan la necesidad de acceder a esa información para realizar tareas relacionadas con la investigación, como las empresas de almacenamiento de datos.</p></li>\n </ul>\n </li>\n <li>\n <span>¿Por cuánto tiempo se usará o se compartirá con otros mi información médica protegida?</span>\n <p class=\"normal\">No hay una fecha prevista para la destrucción de su información médica protegida que se utilice o comparta a raíz del estudio, ya que la investigación es un proceso dinámico.</p>\n </li>\n <li>\n <span>Declaración de los derechos de privacidad:</span>\n <ul class=\"inner-ul-flat-list\">\n <li><p class=\"normal\">Tiene derecho a revocar su autorización para que los médicos e investigadores utilicen su información médica protegida. No podremos retirar toda la información que hayamos compartido con terceros para realizar otras actividades relacionadas, como la supervisión del estudio, o que se necesite para garantizar la calidad del estudio. Si decide revocar su autorización, deberá comunicarse por escrito con el investigador que se indica en la sección: \"¿A quién debo contactar si tengo preguntas sobre el estudio?\".</p></li>\n <li><p class=\"normal\">Tiene derecho a solicitar el acceso a la información médica personal que se use o comparta durante la investigación y que se relacione con su tratamiento o el pago de este. Para solicitar esta información, comuníquese con su médico para que se la pida a los directores del estudio.</p></li>\n </ul>\n </li>\n </ol>"
          }
        }, {
