        "type" : "html",
        "name" : "s1q1_pre",
        "html" : {
          "en" : "<p class=\"PageContent-text\">Thank you for being part of Count Me In. This survey will ask you detailed questions about your diet and lifestyle habits. This survey is long and contains many sections, so we expect it will take most people approximately 30-45 minutes to complete. All questions are optional. You may take a break and come back to the survey at any point if you need to; your responses will be saved where you left off. Please reach out to <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a> if you have any questions.</p><br/><br/>In the following tables, please describe how often on average you have used the amount specified in the PAST 3 MONTHS.<br/><small><em>Please indicate your average total use, taking the portion size into account. For example, if you use 1/2 a glass of milk twice a week, mark 1 glass per week to represent your average total intake. </em></small><br/><small><em>The tables are broken down into the following sections: 1. Milk, 2. Cream/Non-dairy Coffee Whitener, 3. Ice Cream/Sherbet/Frozen Yogurt, 4. Yogurt. Please click on the “Fill in Here” button to complete each section. </em></small><br/>",
          "es" : "<p class=\"PageContent-text\">Gracias por ser parte de Count Me In. Esta encuesta le tendrá preguntas detalladas sobre su dieta y hábitos de estilo de vida. Esta encuesta es larga y contiene varias secciones. Aproximadamente toma entre 30-45 minutes para completar esta encuesta. Todas las preguntas son opcionales. Puede tomar un descanso y volver a la encuesta en cualquier momento; sus respuestas se guardarán automáticamente. Si tiene preguntas, comuníquese con nosotros mandando un correo a <a href=\"mailto:info@joincountmein.org\" class=\"Link\">info@joincountmein.org</a>.</p><br/>Entendemos lo especial que es nuestro idioma alrededor de todos y cada uno de nuestros países. Si no reconoce algunos de los alimentos mencionados en esta encuesta, puede usar esta guía en este <a href=\"https://storage.googleapis.com/cmi-study-dev-assets/pancan/Spanish_Diet%20%26%20Lifestyle%20Spanish%20Food%20Guide_Feb%202022.pdf\" target=\"_blank\" class=\"Link\">enlace</a> para confirmarlos. De clic <a href=\"https://storage.googleapis.com/cmi-study-dev-assets/pancan/Spanish_Diet%20%26%20Lifestyle%20Spanish%20Food%20Guide_Feb%202022.pdf\" target=\"_blank\" class=\"Link\">aquí</a> para la Guía de Alimentos.<br/>En las siguientes tablas, describa con qué frecuencia en promedio ha consumido la cantidad especificada en los ÚLTIMOS 3 MESES.<br/><small><em>Indique su consumo promedio total, teniendo en cuenta el tamaño de la porción. Por ejemplo, si utiliza 1/2 vaso de leche dos veces por semana, marque 1 vaso por semana para representar su promedio de consumo total. </em></small><br/><small><em>Indique su uso total promedio, teniendo en cuenta el tamaño de la porción. Por ejemplo, si usa 1/2 vaso de leche dos veces por semana, marque 1 vaso por semana para representar su ingesta total promedio. </em></small><br/>"
