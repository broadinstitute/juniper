        "type" : "html",
        "name" : "intro1",
        "html" : {
          "en" : "<p>Thank you for your consent to participate in this research study.</p>\n <p>To complete the process and proceed with this study, we will need to collect some additional information from you below about the following:</p>\n <ul>\n <li><p>The name(s) and information for the physician(s) who has/have cared for you throughout your experiences with cancer</p></li>\n <li><p>The names of the hospitals / institutions where you have received treatment or have had procedures performed (e.g. biopsies and/or surgeries)</p></li>\n </ul>\n <p>We may use this information to obtain copies of your medical records, and if you had elected on the informed consent, we may also obtain some of your stored cancer samples.</p>",
          "es" : "<p>Le agradecemos por dar su consentimiento para participar en este estudio de investigación.</p>\n <p>Para completar el proceso y proseguir con el estudio, le solicitamos la siguiente información:</p>\n <ul>\n <li><p>El nombre y la información de contacto de los médicos que lo atiendan o lo hayan atendido durante el cáncer que padece</p></li>\n <li><p>El nombre de los hospitales o instituciones en los que haya recibido tratamiento o en los que se haya realizado procedimientos (como biopsias y operaciones)</p></li>\n </ul>\n <p>Utilizaremos esta información para obtener copias de su historia clínica y, si así lo dispuso en el consentimiento informado, también solicitaremos algunas de sus muestras de cáncer almacenadas.</p>"
        }
      } ]
