        "title" : {
          "en" : "<span>I have already read and signed the informed consent document for this study, which describes the use of my personal health information (Section O: Authorization to use your health information for research purposes), and hereby grant permission to Diane Diehl, PhD, Count Me In, 415 Main Street, 105B, Cambridge, MA 02142, or a member of the study team to examine copies of my medical records pertaining to my cancer diagnosis and treatment, and, if I elected on the informed consent document, to obtain cancer samples and/or blood samples for research studies. I acknowledge that a copy of this completed form will be accessible via my project account.</span>",
          "es" : "<span>Ya he leído y firmado el consentimiento informado para este estudio, en el que se describe cómo se utilizará mi información médica personal (sección O: Autorización para usar su información médica para fines de investigación), y por el presente autorizo al Diane Diehl, PhD, Count Me In, 415 Main Street, 105B, Cambridge, MA 02142 o a los miembros del equipo de investigación a examinar copias de mi historia clínica en relación con mi diagnóstico y tratamiento del cáncer. Asimismo, si así lo decidí en el consentimiento informado, los autorizo a obtener muestras del cáncer o de sangre para el estudio. Entiendo que una copia de este formulario completado estará disponible en mi cuenta del proyecto.</span>"
