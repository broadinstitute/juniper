        "html" : {
          "en" : "<p class=\"ddp-content__agreement only-margin-top extra-margin-top\">By completing this information, you are agreeing to allow us to contact these physician(s) and hospital(s) / institution(s) to obtain your records.</p>",
          "es" : "<p class=\"ddp-content__agreement only-margin-top extra-margin-top\">Al completar esta información, acepta que nos pongamos en contacto con los médicos y hospitales o instituciones para obtener su historia clínica.</p>"
