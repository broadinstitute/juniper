{
  "workflowTransitions": [
    {
      "from": {
        "type": "ACTIVITY",
        "activityCode": ${id.act.prequal}
      },
      "to": [
        {
          "type": "STUDY_REDIRECT",
          "studyGuid": "tRCC",
          "redirectUrl": ${trccRedirectUrl},
          "expression": ${_pex.has_trcc},
        }
      ]
    },

    {
      "from": {
        "type": "ACTIVITY",
        "activityCode": ${id.act.add_child}
      },
      "to": [
        {
          "type": "STUDY_REDIRECT",
          "studyGuid": "tRCC",
          "redirectUrl": ${trccRedirectUrl},
          "expression": ${_pex.addchild_has_trcc},
        }
      ]
    }
  ]
}
