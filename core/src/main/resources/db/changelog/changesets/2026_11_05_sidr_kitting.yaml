databaseChangeLog:
  - changeSet:
      id: "sidr_kitting"
      author: cbarker
      changes:
        - addColumn:
            tableName: study_environment_config
            columns:
              # the defaults backfill all pre-existing studies to Pepper/DSM
              - column: { name: kitting_system, type: text, defaultValue: DSM_PEPPER, constraints: { nullable: false } }
              - column: { name: use_stub_sidr, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              # the name of the SIDREnvironment enum
              - column: { name: sidr_environment, type: text, defaultValue: PRODUCTION, constraints: { nullable: false } }
              - column: { name: sidr_project, type: text }
        # new studies get their kitting system from the application (SIDR), so don't leave a hidden db default behind
        - dropDefaultValue:
            tableName: study_environment_config
            columnName: kitting_system
        - addColumn:
            tableName: kit_request
            columns:
              # the default backfills all pre-existing kits to Pepper/DSM
              - column: { name: external_kit_system, type: text, defaultValue: DSM_PEPPER, constraints: { nullable: false } }
              - column: { name: external_order_id, type: text }
